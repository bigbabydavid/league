<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yankees Series Snapshot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Sofia+Sans+Extra+Condensed:wght@700;800&family=Sofia+Sans+Semi+Condensed:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  /* Scoresheet palette — matches the Google Sheet this replaces: white paper, red labels,
     yellow/blue alternating game blocks, a gridline on every cell.
     The broadcast lower-third canvas (renderLowerThird) stays dark on purpose — it goes over video. */
  :root{
    --paper:#fff; --chrome:#F7F7F7; --ink:#1F1F1F; --dim:#6B6B6B;
    --grid:#B7B7B7; --hard:#7F7F7F;
    --red:#C00000; --blue:#1F4E79; --green:#217346;
    --gA:#FFF2CC; --gAlite:#FFFAEB;      /* game block A — the sheet's yellow */
    --gB:#DDEBF7; --gBlite:#F2F8FD;      /* game block B — the sheet's blue */
    --tot:#F2F2F2; --tothead:#F4CCCC;    /* totals block + its pink header */
    --team:#D9D9D9; --sum:#E6E6E6; --sub:#EFEFEF;
    --pick:#FFE599; --colpick:#CFE2F3;
  }
  *{box-sizing:border-box}
  body{margin:0;color:var(--ink);background:var(--paper);
    font-family:"Sofia Sans Semi Condensed",Roboto,system-ui,sans-serif}
  header{padding:14px 20px 12px;border-bottom:2px solid var(--hard);background:var(--chrome);
    position:sticky;top:0;z-index:40}
  .eyebrow{font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:800;text-transform:uppercase;
    font-size:12px;letter-spacing:2px;color:var(--dim);margin:0 0 4px}
  .eyebrow::before{content:"— ";color:var(--red)}
  .titlerow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  h1{font-family:"Anton",sans-serif;font-style:normal;font-size:34px;margin:0;letter-spacing:.5px}
  h1 span{color:var(--red)}
  .matchup{display:flex;align-items:center;gap:8px}
  .matchup img{width:30px;height:30px;border-radius:50%;background:#fff;padding:3px;
    box-shadow:0 0 0 1px var(--grid);object-fit:contain}
  .matchup .x{color:var(--dim);font-weight:800;font-size:13px}
  .datanote{position:absolute;top:14px;right:20px;font-family:"Sofia Sans Extra Condensed",sans-serif;
    font-size:11px;letter-spacing:.4px;color:var(--dim);background:#fff;border:1px solid var(--grid);
    border-radius:4px;padding:5px 9px;text-transform:uppercase}
  .datanote b{color:var(--ink);font-weight:800}
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-top:10px}
  label{display:block;font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:800;
    text-transform:uppercase;font-size:12px;letter-spacing:1px;color:var(--red);margin-bottom:3px}
  select,input{background:#fff;color:var(--ink);border:1px solid var(--grid);border-radius:4px;
    padding:7px 9px;font-family:inherit;font-size:15px;max-width:min(60vw,520px)}
  select:focus,input:focus{outline:2px solid var(--red);outline-offset:1px}
  input::placeholder{color:#a8a8a8}
  #status{padding:14px 20px;color:var(--dim)}
  #status.err{color:var(--red)}
  main{padding:0 20px 60px}
  h2{font-family:"Anton",sans-serif;font-style:normal;font-size:21px;margin:24px 0 7px;letter-spacing:.5px;
    text-transform:uppercase;color:var(--red)}
  .wrap{overflow-x:auto;border:1px solid var(--hard);background:#fff}

  /* ---- tables: a gridline around every cell, like the sheet ---- */
  table{border-collapse:separate;border-spacing:0;font-size:14px;white-space:nowrap}
  th,td{padding:4px 8px;text-align:right;border-bottom:1px solid var(--grid);border-right:1px solid var(--grid)}
  thead th{position:sticky;background:#fff;z-index:10;
    font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:800;
    text-transform:uppercase;letter-spacing:.6px;font-size:12px;color:var(--red)}
  thead tr:first-child th{top:0}
  thead tr:nth-child(2) th{top:25px}
  th.name,td.name{text-align:left;position:sticky;left:0;background:#fff;z-index:20;
    min-width:190px;border-right:2px solid var(--hard)}
  thead th.name{z-index:30}
  td.num{font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
  .gstart{border-left:2px solid var(--hard)}
  .tot,thead th.tot{background:var(--tot)}
  td.tot{color:var(--ink);font-weight:800}
  .rate-dim{color:var(--dim) !important;font-weight:600 !important}
  .ops-strong{font-weight:900 !important;font-size:1.08em}
  thead th.tothead{background:var(--tothead);color:var(--red)}
  tr.team td{background:var(--team);font-family:"Anton",sans-serif;font-style:normal;
    font-size:16px;text-align:left;color:var(--blue);letter-spacing:.5px;padding:6px 8px;
    text-transform:uppercase;border-bottom:1px solid var(--hard)}
  tr.team td.name{background:var(--team)}
  tr.sum td{font-weight:800;border-top:2px solid var(--hard);background:var(--sum)}
  tr.sum td.name{background:var(--sum);color:var(--red)}
  tr.subsum td{background:var(--sub);border-top-color:var(--grid)}
  tr.subsum td.name{background:var(--sub);color:var(--blue)}
  td.z{color:#B0B0B0}
  tbody tr:not(.team){cursor:pointer}
  /* :not(.pick) so a clicked row turns yellow instantly instead of waiting for the cursor to leave */
  tbody tr:not(.team):not(.pick):hover td{background:#E4E4E4}
  tbody tr:not(.team):not(.pick):hover td.name{background:#E4E4E4}
  tr.pick td,tr.pick td.name,tr.pick td.tot{background:var(--pick);color:var(--ink);font-weight:800}
  tr.pick td.z{color:#8a7a3a}
  tr.pick td.name{border-left:4px solid var(--red);padding-left:4px}
  thead th[data-stat]{cursor:pointer}
  thead th[data-stat]:hover{background:var(--colpick)}
  th.gclick{cursor:pointer}
  th.gclick:hover{filter:brightness(.94)}
  th.gclick:hover .glabel::after{content:" ✕";opacity:.6}
  /* ---- Pitchers by Game: one row per game, each team its own collapsible panel side by side ---- */
  .pitgames{display:flex;flex-direction:column;gap:16px}
  .pitgame{display:flex;flex-wrap:nowrap;align-items:flex-start;gap:14px}
  .pitgame-label{flex:0 0 auto;writing-mode:vertical-rl;transform:rotate(180deg);
    font-family:"Anton",sans-serif;font-size:14px;letter-spacing:.3px;color:var(--red);
    text-transform:uppercase;padding:6px 2px;align-self:stretch;display:flex;align-items:center;
    justify-content:center;border:1px solid var(--hard);background:var(--chrome)}
  .pitteam{flex:none;border:1px solid var(--hard);min-width:230px}
  .pitteam table{margin:0}
  .pitteam-head{cursor:pointer;background:var(--team);font-family:"Anton",sans-serif;font-weight:400;
    font-size:15px;text-transform:uppercase;letter-spacing:.3px;color:var(--blue);padding:6px 10px;
    border-bottom:1px solid var(--hard);white-space:nowrap}
  .pitteam.opp .pitteam-head{background:var(--chrome);color:var(--dim)}
  .pitteam-head:hover{filter:brightness(.94)}
  .pitteam.closed .pitteam-head{border-bottom:none}
  /* ---- a collapsed game: the whole column narrows to a thin clickable strip, still in place ---- */
  .gthin{width:20px;min-width:20px;max-width:20px;padding:4px 0;background:var(--chrome);cursor:pointer}
  th.gthin{background:var(--team)}
  .gthin:hover{background:var(--pick)}
  .gstub{writing-mode:vertical-rl;transform:rotate(180deg);font-family:"Sofia Sans Extra Condensed",sans-serif;
    font-weight:800;font-size:11px;letter-spacing:.5px;color:var(--red);margin:0 auto}
  td.colpick{background:var(--colpick);color:var(--ink);font-weight:800}
  td.colpick.z{color:#5b7a94}
  thead th.colpick{background:var(--colpick);color:var(--blue)}
  tr.pick td.colpick{background:#EBDFA0}
  .pos{color:var(--dim);font-size:12px;margin-left:5px}
  .glabel{font-family:"Sofia Sans Semi Condensed",sans-serif;font-weight:800;font-size:13px;
    color:var(--ink);text-transform:none;letter-spacing:0}
  .gres{font-weight:800}
  .w{color:var(--green)} .l{color:var(--red)} .live{color:#B8860B}
  .sched{color:#3d3d3d;font-size:14px;margin:0 0 10px;line-height:1.5;white-space:pre-line}
  button{background:#fff;color:var(--ink);border:1px solid var(--grid);border-radius:4px;
    padding:7px 11px;font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:800;
    text-transform:uppercase;letter-spacing:.8px;font-size:13px;cursor:pointer}
  button:hover{border-color:var(--red);color:var(--red)}
  button:disabled{opacity:.4;cursor:default;border-color:var(--grid);color:var(--ink)}
  @media (max-width:640px){
    .datanote{position:static;display:inline-block;margin:0 0 8px}
    h1{font-size:28px}
    .matchup img{width:24px;height:24px}
  }
  table.players td.name{cursor:pointer}
  table.players td.name:hover{text-decoration:underline;text-decoration-color:var(--red);text-decoration-thickness:2px}

  /* ---- player modal ---- */
  .modal-backdrop{position:fixed;inset:0;background:rgba(40,40,40,.5);display:flex;
    align-items:center;justify-content:center;z-index:100;padding:20px}
  .modal-backdrop[hidden]{display:none}
  .modal{background:#fff;border:1px solid var(--hard);border-radius:6px;max-width:420px;
    width:100%;max-height:86vh;overflow:auto;padding:20px;position:relative;
    box-shadow:0 18px 50px rgba(0,0,0,.3)}
  .modal-close{position:absolute;top:10px;right:10px;background:#fff;border:1px solid var(--grid);
    color:var(--dim);width:28px;height:28px;border-radius:50%;font-size:17px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center}
  .modal-close:hover{color:var(--red);border-color:var(--red)}
  .modal-head{display:flex;align-items:center;gap:14px;margin-bottom:16px;padding-right:38px}
  .modal-headshot{width:72px;height:72px;border-radius:50%;object-fit:cover;background:var(--chrome);
    border:2px solid var(--grid);flex:none}
  .modal-name{font-family:"Anton",sans-serif;font-size:21px;letter-spacing:.3px;line-height:1.1}
  .modal-sub{color:var(--dim);font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:800;
    text-transform:uppercase;font-size:12px;letter-spacing:1px;margin-top:4px}
  .modal-export-row{display:flex;gap:12px;margin-top:7px;align-items:center}
  .modal-export-btn{background:none;border:none;padding:0;margin:0;color:var(--dim);
    font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:700;text-transform:uppercase;
    font-size:10px;letter-spacing:.6px;cursor:pointer;opacity:.75}
  .modal-export-btn:hover{opacity:1;color:var(--red)}
  .modal-export-btn:disabled{opacity:.3;cursor:default}
  .modal-splits{flex-wrap:wrap;row-gap:4px}
  .modal-split-btn{background:#fff;border:1px solid var(--grid);color:var(--dim);border-radius:999px;
    font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:700;text-transform:uppercase;
    font-size:10px;letter-spacing:.4px;padding:3px 8px;cursor:pointer}
  .modal-split-btn:hover{color:var(--red);border-color:var(--red)}
  .modal-split-btn.active{background:var(--red);border-color:var(--red);color:#fff}
  .modal-split-date{background:#fff;border:1px solid var(--grid);color:var(--dim);border-radius:999px;
    font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:700;font-size:10px;letter-spacing:.4px;
    padding:2px 8px;cursor:pointer}
  .modal-split-date:hover{color:var(--red);border-color:var(--red)}
  .modal-split-date.active{background:var(--red);border-color:var(--red);color:#fff}
  .modal-split-date.active::-webkit-calendar-picker-indicator{filter:invert(1)}
  .modal-section{margin-bottom:16px}
  .modal-section h3{font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:800;
    text-transform:uppercase;font-size:12px;letter-spacing:1.5px;color:var(--red);margin:0 0 8px}
  .modal-section h3::before{content:"— "}
  .modal-line{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;
    color:var(--ink);margin-bottom:10px;font-weight:800}
  .modal-hitline{font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:700;
    text-transform:uppercase;letter-spacing:.5px;font-size:12px;color:var(--dim);margin-bottom:4px}
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .stat-grid .cell{background:var(--chrome);border:1px solid var(--grid);border-radius:4px;
    padding:7px 4px;text-align:center}
  .stat-grid .cell .v{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;
    font-weight:800;color:var(--ink)}
  .stat-grid .cell .k{font-size:10px;color:var(--dim);text-transform:uppercase;
    letter-spacing:.5px;margin-top:3px}
  .modal-empty{color:var(--dim);font-size:13px}
  .modal-dlnote{color:var(--dim);font-size:10px;text-align:right;margin-top:8px;min-height:12px}

  /* ---- control page: on-air status chip ---- */
  .onair{display:flex;align-items:center;gap:8px;margin-top:10px;font-family:"Sofia Sans Extra Condensed",sans-serif;
    font-size:12px;letter-spacing:.4px;color:var(--dim)}
  .onair-dot{width:8px;height:8px;border-radius:50%;background:var(--red);flex:none;
    box-shadow:0 0 0 3px rgba(192,0,0,.18);animation:onair-pulse 1.6s ease-in-out infinite}
  @keyframes onair-pulse{50%{opacity:.35}}
  #onairText b{color:var(--ink);font-weight:800}
  #onairClear{background:none;border:none;padding:0;color:var(--dim);text-decoration:underline;
    text-decoration-color:var(--grid);font-family:inherit;font-size:11px;cursor:pointer}
  #onairClear:hover{color:var(--red);text-decoration-color:var(--red)}

  /* ---- OBS display view (?display=1): a standalone, self-updating lower third, drawn onto a
     fixed 1920x1080 canvas (like the PNG export) so the OBS source can be added once at full
     broadcast size and never repositioned — the bar always lands in the same spot. Stays dark
     and self-contained (hex, not theme vars) since it renders over video, not the light tool UI. ---- */
  #lowerThirdDisplay{display:none}
  body.display-mode #lowerThirdDisplay{display:block;position:relative;width:1920px;height:1080px}
  .lt-bar{display:flex;align-items:center;gap:22px;position:absolute;left:0;right:0;bottom:60px;height:200px;
    padding:0 40px;background-color:#0E2340;
    background-image:linear-gradient(#F5F7FA,#F5F7FA),
      repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 1px, transparent 1px 26px);
    background-repeat:no-repeat,repeat; background-size:100% 5px,auto; background-position:top left,top left;
    box-sizing:border-box}
  .lt-bar[hidden]{display:none}
  .lt-headshot{width:152px;height:152px;border-radius:50%;object-fit:cover;background:#153157;
    border:5px solid #F5F7FA;flex:none}
  .lt-info{flex:none; min-width:0}
  .lt-name{font-family:"Anton",sans-serif;font-size:56px;line-height:1.05;color:#F5F7FA;white-space:nowrap}
  .lt-sub{font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:700;font-size:20px;
    color:#93a5c2;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
  .lt-divider{width:2px;align-self:stretch;margin:34px 0;background:#26426e;flex:none}
  .lt-stats{flex:1;min-width:0;text-align:center;position:relative;align-self:stretch;
    display:flex;flex-direction:column;justify-content:center}
  .lt-hitline{position:absolute;top:14px;left:0;right:0;margin:0;font-family:"Sofia Sans Extra Condensed",sans-serif;
    font-weight:700;font-size:22px;letter-spacing:.4px;text-transform:uppercase}
  .lt-hitline .lt-splitlabel{color:#F5F7FA}
  .lt-hitline .lt-hitcount{color:#93a5c2}
  .lt-cells{display:flex;justify-content:space-between;align-items:center;width:100%;flex-wrap:nowrap}
  .lt-cells .lt-cell{text-align:center;flex:0 0 auto}
  .lt-cell .v{font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:800;color:#F5F7FA;line-height:1}
  .lt-cell .k{font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:700;line-height:1;margin-top:2px;
    color:#93a5c2;text-transform:uppercase;letter-spacing:.4px}
  .lt-watermark{position:absolute;right:20px;bottom:14px;font-family:"Sofia Sans Extra Condensed",sans-serif;
    font-weight:700;font-size:14px;letter-spacing:.4px;color:rgba(255,255,255,.35)}
  body.display-mode{background:transparent}
  body.display-mode header, body.display-mode main, body.display-mode #status,
  body.display-mode .modal-backdrop{display:none}

  /* ---- view panel: chips that hide games / teams / individual stats ---- */
  #viewbox{margin-top:9px}
  #viewbox>summary{cursor:pointer;list-style:none;font-family:"Sofia Sans Extra Condensed",sans-serif;
    font-weight:800;text-transform:uppercase;font-size:12px;letter-spacing:1px;color:var(--dim)}
  #viewbox>summary::-webkit-details-marker{display:none}
  #viewbox>summary::before{content:"▸ ";color:var(--red)}
  #viewbox[open]>summary::before{content:"▾ "}
  #viewbox>summary:hover{color:var(--red)}
  .chiprow{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:5px 0}
  .chiplabel{font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:800;text-transform:uppercase;
    font-size:11px;letter-spacing:1px;color:var(--red);min-width:120px}
  .chip{padding:3px 9px;font-size:11px;letter-spacing:.4px;border-radius:999px}
  .chip.off{color:#a0a0a0;background:var(--chrome);text-decoration:line-through}

  /* ---- restore bar: whatever's currently collapsed, one click from coming back ---- */
  .restorebar{padding:8px 20px;margin:0;background:var(--tothead);border-bottom:1px solid var(--hard)}
  .restorebar .chiplabel{min-width:auto}
  .restorebar .chip.restore{background:#fff;border-color:var(--red);color:var(--red);font-weight:800}
  .restorebar .chip.restore:hover{background:var(--red);color:#fff}

  /* ---- collapsible sections ---- */
  #out details>summary{list-style:none;cursor:pointer}
  #out details>summary::-webkit-details-marker{display:none}
  #out summary h2::before{content:"▸ "}
  #out details[open]>summary h2::before{content:"▾ "}
  #out summary:hover h2{color:#8a0000}

  /* ---- alternating game blocks, straight off the scoresheet ---- */
  #out thead th.sdesc::after{content:" ▼";font-size:9px}
  #out thead th.sasc::after{content:" ▲";font-size:9px}
  #out thead th.gA{background:var(--gA)}
  #out thead th.gB{background:var(--gB)}
  #out tbody tr:not(.pick):not(:hover) td.gA:not(.colpick){background:var(--gAlite)}
  #out tbody tr:not(.pick):not(:hover) td.gB:not(.colpick){background:var(--gBlite)}
  #out tbody tr.team td.gA,#out tbody tr.team td.gB{background:var(--team)}

  span.note{font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:800;font-size:11px;
    letter-spacing:.5px;margin-left:5px;text-transform:uppercase}
</style>
</head>
<body>
<header>
  <div class="datanote" id="datanote">Data note: <b>Live via MLB StatsAPI</b></div>
  <div class="eyebrow">Talkin' Yanks</div>
  <div class="titlerow">
    <h1>SERIES SNAPSHOT<span>.</span></h1>
    <div class="matchup" id="matchup"></div>
  </div>
  <div class="controls">
    <div><label for="season">Season</label><select id="season"></select></div>
    <div><label for="series">Series</label><select id="series"><option>—</option></select></div>
    <div><label for="find">Find player</label><input id="find" type="search" placeholder="Rice, Volpe, Judge…" autocomplete="off"></div>
    <div><label>OBS Display</label>
      <button id="openDisplay" type="button">Open Display ↗</button>
    </div>
  </div>
  <div class="onair" id="onair" hidden>
    <span class="onair-dot"></span>
    <span id="onairText"></span>
    <button id="onairClear" type="button">Clear</button>
  </div>
  <details id="viewbox">
    <summary>View — hide games, teams or stats</summary>
    <div id="viewchips"></div>
  </details>
</header>
<div id="status">Loading…</div>
<div id="collapsedBar" class="chiprow restorebar" hidden></div>
<main id="out"></main>

<div id="modalBackdrop" class="modal-backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalName">
    <button id="modalClose" class="modal-close" type="button" aria-label="Close">×</button>
    <div class="modal-head">
      <img id="modalHeadshot" class="modal-headshot" alt="">
      <div>
        <div class="modal-name" id="modalName"></div>
        <div class="modal-sub" id="modalSub"></div>
        <div class="modal-export-row modal-splits" id="modalSplit"></div>
        <div class="modal-export-row">
          <button id="modalDownload" class="modal-export-btn" type="button"
            title="Download the selected split as a broadcast lower-third PNG">PNG ⤓</button>
        </div>
      </div>
    </div>
    <div id="modalBody" class="modal-body"></div>
    <div id="modalDlNote" class="modal-dlnote"></div>
  </div>
</div>

<!-- OBS Browser Source view: add this same file/URL with ?display=1 as a Browser Source.
     Everything above is hidden by CSS in display mode; only the bar below renders, on a
     transparent background, and it updates itself whenever the control page (this file,
     opened normally) pushes a new selection. -->
<div id="lowerThirdDisplay">
  <div class="lt-bar" id="ltBar" hidden>
    <img id="ltHeadshot" class="lt-headshot" alt="">
    <div class="lt-info">
      <div class="lt-name" id="ltName"></div>
      <div class="lt-sub" id="ltSub"></div>
    </div>
    <div class="lt-divider"></div>
    <div class="lt-stats">
      <div class="lt-hitline" id="ltHitline"></div>
      <div class="lt-cells" id="ltCells"></div>
    </div>
    <div class="lt-watermark">TALKIN' YANKS</div>
  </div>
</div>

<script>
const API = 'https://statsapi.mlb.com/api/v1';
const j = u => fetch(u).then(r => { if(!r.ok) throw new Error(u+' → '+r.status); return r.json(); });
const $ = id => document.getElementById(id);
const el = (t, cls, txt) => { const e = document.createElement(t); if(cls) e.className = cls; if(txt != null) e.textContent = txt; return e; };

// ---- control ↔ display link: this same file, opened a second time with ?display=1, becomes an
// OBS Browser Source that shows whichever player was last clicked here — no server involved.
// BroadcastChannel pushes it live to any other tab of this file open in the same browser engine;
// localStorage is the fallback so a display opened later still picks up the last pick.
const LT_KEY = 'ty-lower-third-onair';
const isDisplayMode = new URLSearchParams(location.search).get('display') === '1';
const ltChannel = 'BroadcastChannel' in window ? new BroadcastChannel('ty-lower-third') : null;
if (isDisplayMode) document.body.classList.add('display-mode');

const BAT = [['atBats','AB'],['runs','R'],['hits','H'],['rbi','RBI'],['homeRuns','HR'],['baseOnBalls','BB'],
             ['strikeOuts','K'],['plateAppearances','PA'],['sacFlies','SF'],
             ['stolenBases','SB'],['caughtStealing','CS'],['hitByPitch','HBP']];
const PIT = [['outs','IP'],['hits','H'],['runs','R'],['earnedRuns','ER'],['baseOnBalls','BB'],['strikeOuts','K'],['homeRuns','HR']];
// summed but not shown per game — SLG/OPS need totalBases, and GIDP is series-totals-only (see `rates`)
const BAT_SUM = [...BAT, ['totalBases','TB'], ['groundIntoDoublePlay','GIDP']];
const ip = outs => Math.floor(outs/3) + '.' + (outs % 3);
const avg = r => r.atBats ? (r.hits/r.atBats).toFixed(3).replace(/^0/,'') : '.---';
const era = r => r.outs ? (r.earnedRuns*27/r.outs).toFixed(2) : '-.--';
const obpStr = r => rate(r.hits + r.baseOnBalls + r.hitByPitch,
                         r.atBats + r.baseOnBalls + r.hitByPitch + r.sacFlies);
const slgStr = r => rate(r.totalBases, r.atBats);
const opsStr = r => (obp(r) + (r.atBats ? r.totalBases/r.atBats : 0)).toFixed(3).replace(/^0/,'');
const mmdd = d => new Date(d + 'T12:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
const filled = o => o && Object.keys(o).length;   // API sends {} for "did not appear"

// ---- what's hidden: one Set per chip group, survives repaints and series changes ----
const SD = ['away', 'home'];
const hides = {};                                        // group key → Set of hidden labels
const hset = k => hides[k] || (hides[k] = new Set());
// col defs are [key,label] pairs (label at index 1) or plain label strings
const shown = (k, cols, li = 1) => cols.filter(c => !hset(k).has(Array.isArray(c) ? c[li] : c));
const anyShown = (k, labels) => labels.some(l => !hset(k).has(l));
const collapsed = new Set();                             // section titles the user closed

// Which stat column the tables are sorted by, if any. Set by clicking a stat header:
// {tbl: which table, stat: column label, gi: game index or null for the series-total group, dir: -1 desc / 1 asc}
let sortBy = null;
const sortActive = tbl => sortBy && sortBy.tbl === tbl ? sortBy : null;
// numbers arrive as strings ('.271', '6.1', '–'); a blank cell must never sort as zero
const sortNum = v => { const n = parseFloat(v); return isNaN(n) ? null : n; };
// null = didn't appear, always last whichever way we're sorting
const sortCmp = (dir, val) => (a, b) => {
  const av = val(a), bv = val(b);
  if (av === bv) return 0;
  if (av === null) return 1;
  if (bv === null) return -1;
  return (av - bv) * dir;
};

// re-light the sorted column and mark its header with a direction arrow (state, so it survives a repaint)
function paintSortLight() {
  if (!sortBy) return;
  const tables = document.querySelectorAll(`#out table[data-tbl="${sortBy.tbl}"]`);
  tables.forEach(t => {
    t.querySelectorAll(`[data-stat="${sortBy.stat}"]`).forEach(c => c.classList.add('colpick'));
    t.querySelectorAll(`thead th[data-stat="${sortBy.stat}"]`).forEach(th => {
      const gi = th.dataset.gi === undefined ? null : +th.dataset.gi;
      if (gi === sortBy.gi) th.classList.add(sortBy.dir === -1 ? 'sdesc' : 'sasc');
    });
  });
}

function chipRow(title, labels, key) {
  const row = el('div', 'chiprow');
  row.appendChild(el('span', 'chiplabel', title));
  labels.forEach(lbl => {
    const b = el('button', 'chip' + (hset(key).has(lbl) ? ' off' : ''), lbl);
    b.onclick = () => { hset(key).has(lbl) ? hset(key).delete(lbl) : hset(key).add(lbl); repaint(); };
    row.appendChild(b);
  });
  $('viewchips').appendChild(row);
}

// A standing "click to bring it back" strip for whatever's currently collapsed — games, teams,
// stat columns, anything hidden via a chip. Sits above the tables, outside the View panel, so
// undoing a collapse never requires opening that panel back up.
function paintCollapsedBar() {
  const bar = $('collapsedBar'); if (!bar) return;
  // games get their own inline thin-column stub right in the table now — no need to duplicate
  // them up here too, so this bar is just for teams/stat-column hides, which don't have that.
  const entries = Object.entries(hides).filter(([key]) => key !== 'game')
    .flatMap(([key, set]) => [...set].map(v => ({ key, v })));
  bar.hidden = !entries.length;
  bar.innerHTML = '';
  if (!entries.length) return;
  bar.appendChild(el('span', 'chiplabel', 'Collapsed'));
  entries.forEach(({ key, v }) => {
    const b = el('button', 'chip restore', v + '  ↩');
    b.title = `Bring "${v}" back`;
    b.onclick = () => { hset(key).delete(v); repaint(); };
    bar.appendChild(b);
  });
}

// Toggling a chip only changes what's drawn, never what's fetched — the loader stashes a
// painter closure over the data it already has and repaint() re-runs just that.
let paintFn = null;
function repaint() {
  if (!paintFn) return;
  $('out').innerHTML = ''; $('viewchips').innerHTML = '';
  const row = el('div', 'chiprow');
  const all = el('button', 'chip', 'Show everything');
  all.onclick = () => { Object.keys(hides).forEach(k => hides[k].clear()); collapsed.clear(); collapsedPitTeams.clear(); repaint(); };
  row.appendChild(all); $('viewchips').appendChild(row);
  paintCollapsedBar();
  try { paintFn(); } catch (e) { say(e.message, true); }
}

// collapsible section: summary/h2 + optional note + horizontally scrollable table
function addTable(title, table, note) {
  const d = el('details');
  d.open = !collapsed.has(title);
  const sm = el('summary');
  sm.appendChild(el('h2', null, title));
  d.appendChild(sm);
  if (note) d.appendChild(el('div', 'sched', note));
  if (table) { const w = el('div', 'wrap'); w.appendChild(table); d.appendChild(w); }
  d.ontoggle = () => d.open ? collapsed.delete(title) : collapsed.add(title);
  $('out').appendChild(d);
}

const teamId = () => 147, teamName = () => 'New York Yankees';
const logoURL = id => `https://www.mlbstatic.com/team-logos/${id}.svg`;
function setMatchup(oppId, oppName) {
  const m = $('matchup');
  if (!oppId) { m.innerHTML = ''; return; }
  m.innerHTML = `<img src="${logoURL(teamId())}" alt="Yankees" onerror="this.remove()">`
    + `<span class="x">×</span>`
    + `<img src="${logoURL(oppId)}" alt="${oppName || ''}" onerror="this.remove()">`;
}
let series = [];
let currentIndex = new Map();  // pid → row data for whichever view is on screen, used by the player modal
let indexMode = 'played';      // 'played' → row has .bat/.pit series sums; 'preview' → row has .hitting/.pitching {a,b}
let playerYear = '';
let modalPid = null;
let modalSplitKey = 'season';   // which split the split-tab buttons currently have active
let lastCustomDate = '';        // last date picked in the custom "since ___" field

const headshotURL = pid =>
  `https://img.mlbstatic.com/mlb-photos/image/upload/d_people:generic:headshot:67:current.png,q_auto:best,f_auto/v1/people/${pid}/headshot/67/current`;

function closeModal() { $('modalBackdrop').hidden = true; }

function statGrid(pairs) {
  return `<div class="stat-grid">` + pairs.map(([k, v]) =>
    `<div class="cell"><div class="v">${v}</div><div class="k">${k}</div></div>`).join('') + `</div>`;
}

// our own series-long sums (BAT_SUM / PIT shape) → a hits-for-AB line, a slash line, and a counting-stat grid
function seriesBattingBlock(sums) {
  const line = `${avg(sums)} / ${obpStr(sums)} / ${rate(sums.totalBases, sums.atBats)} / ${opsStr(sums)}`;
  return `<div class="modal-hitline">${sums.hits}-for-${sums.atBats}</div>`
    + `<div class="modal-line">${line} <span style="color:var(--dim);font-weight:400">AVG/OBP/SLG/OPS</span></div>`
    + statGrid([['HR', sums.homeRuns], ['RBI', sums.rbi], ['BB', sums.baseOnBalls],
                ['K', sums.strikeOuts], ['SB', sums.stolenBases], ['HBP', sums.hitByPitch]]);
}
function seriesPitchingBlock(sums) {
  return `<div class="modal-line">${ip(sums.outs)} IP · ${era(sums)} ERA</div>`
    + statGrid([['H', sums.hits], ['R', sums.runs], ['ER', sums.earnedRuns], ['BB', sums.baseOnBalls],
                ['K', sums.strikeOuts], ['HR', sums.homeRuns]]);
}
// MLB stats-API season objects already carry formatted rate stats
function apiBattingBlock(st) {
  if (!st) return `<div class="modal-empty">No season batting stats.</div>`;
  return `<div class="modal-hitline">${st.hits}-for-${st.atBats}</div>`
    + `<div class="modal-line">${st.avg} / ${st.obp} / ${st.slg} / ${st.ops} <span style="color:var(--dim);font-weight:400">AVG/OBP/SLG/OPS</span></div>`
    + statGrid([['HR', st.homeRuns], ['RBI', st.rbi], ['BB', st.baseOnBalls],
                ['K', st.strikeOuts], ['SB', st.stolenBases], ['HBP', st.hitByPitch]]);
}
function apiPitchingBlock(st) {
  if (!st) return `<div class="modal-empty">No season pitching stats.</div>`;
  return `<div class="modal-line">${st.inningsPitched} IP · ${st.era} ERA · ${st.wins}-${st.losses}</div>`
    + statGrid([['WHIP', st.whip], ['K', st.strikeOuts], ['BB', st.baseOnBalls],
                ['SV', st.saves], ['ER', st.earnedRuns], ['G', st.gamesPlayed]]);
}

async function seasonStat(pid, group, year) {
  const d = await jc(`${API}/people/${pid}/stats?stats=season&season=${year}&group=${group}`);
  const sec = (d.stats || [])[0];
  return sec && sec.splits.length ? sec.splits[0].stat : null;
}

// Every tab pullable for a lower third. 'series' only makes sense once a series has actually
// been played (filtered out in openPlayerModal for an upcoming one). vsL/vsR relabel per
// discipline (a hitter sees "vs LHP", a pitcher sees "vs LHB") — also handled in openPlayerModal.
const SPLITS = [
  ['series', 'This Series'],
  ['season', 'Full Season'],
  ['l7', 'Last Week'],
  ['l14', 'Last 2 Weeks'],
  ['l30', 'Last 30 Days'],
  ['month', 'This Month'],
  ['asb', 'Since All-Star Break'],
  ['vsL', 'vs LHP'],
  ['vsR', 'vs RHP'],
];

function dateRangeFor(key) {
  const end = new Date(), fmt = d => d.toISOString().slice(0, 10);
  if (key.startsWith('custom:')) return { startDate: key.slice(7), endDate: fmt(end) };
  const start = new Date(end);
  if (key === 'l7') start.setDate(start.getDate() - 7);
  else if (key === 'l14') start.setDate(start.getDate() - 14);
  else if (key === 'l30') start.setDate(start.getDate() - 30);
  else if (key === 'month') start.setDate(1);
  return { startDate: fmt(start), endDate: fmt(end) };
}

// group: 'hitting' | 'pitching'. splitKey: one of SPLITS' first column.
async function fetchSplitStat(pid, group, splitKey, year) {
  const base = `${API}/people/${pid}/stats?season=${year}&group=${group}`;
  let url;
  if (splitKey === 'season') url = `${base}&stats=season`;
  else if (splitKey === 'asb') url = `${base}&stats=sinceLastAllStarGame`;
  else if (splitKey === 'vsL' || splitKey === 'vsR') url = `${base}&stats=statSplits&sitCodes=${splitKey === 'vsL' ? 'vl' : 'vr'}`;
  else { const { startDate, endDate } = dateRangeFor(splitKey); url = `${base}&stats=byDateRange&startDate=${startDate}&endDate=${endDate}`; }
  const d = await jc(url);
  const sec = (d.stats || [])[0];
  return sec && sec.splits.length ? sec.splits[0].stat : null;
}

// K%/BB% aren't in the raw counting stats — both need the plate-appearance (or batters-faced)
// denominator the MLB stat objects already carry.
const pct = (n, d) => d ? Math.round(n / d * 100) + '%' : '—';
const kRate = (st, pa) => pct(+st.strikeOuts || 0, +st[pa] || 0);
const bbRate = (st, pa) => pct(+st.baseOnBalls || 0, +st[pa] || 0);

async function openPlayerModal(pid) {
  const row = currentIndex.get(String(pid));
  if (!row) return;
  modalPid = pid;
  $('modalDlNote').textContent = '';
  $('modalHeadshot').src = headshotURL(pid);
  $('modalName').textContent = row.name;
  $('modalSub').textContent = [row.pos, row.team].filter(Boolean).join(' · ');
  const isPitcher = indexMode === 'played' ? !!row.pit && !row.bat : !!row.pitching && !row.hitting;
  const tabs = indexMode === 'played' ? SPLITS : SPLITS.filter(([k]) => k !== 'series');
  modalSplitKey = indexMode === 'played' ? 'series' : 'season';
  $('modalSplit').innerHTML = tabs.map(([k]) => {
    const text = splitDisplayName(k, isPitcher);
    return `<button type="button" class="modal-split-btn${k === modalSplitKey ? ' active' : ''}" data-split="${k}">${text}</button>`;
  }).join('') + `<input type="date" id="modalCustomDate" class="modal-split-date" max="${new Date().toISOString().slice(0, 10)}"
    title="Pull stats since a specific date" value="${lastCustomDate}">`;
  $('modalSplit').onclick = e => {
    const b = e.target.closest('.modal-split-btn'); if (!b) return;
    modalSplitKey = b.dataset.split;
    $('modalSplit').querySelectorAll('.modal-split-btn').forEach(x => x.classList.toggle('active', x === b));
    $('modalCustomDate').classList.remove('active');
    pushSplit(pid, modalSplitKey);
  };
  $('modalCustomDate').onchange = e => {
    if (!e.target.value) return;
    lastCustomDate = e.target.value;
    modalSplitKey = 'custom:' + e.target.value;
    $('modalSplit').querySelectorAll('.modal-split-btn').forEach(x => x.classList.remove('active'));
    e.target.classList.add('active');
    pushSplit(pid, modalSplitKey);
  };
  $('modalBackdrop').hidden = false;

  const parts = [];
  if (indexMode === 'played') {
    if (row.bat) parts.push(['Series', seriesBattingBlock(row.bat)]);
    if (row.pit) parts.push(['Series', seriesPitchingBlock(row.pit)]);
    $('modalBody').innerHTML = parts.map(([t, html]) => `<div class="modal-section"><h3>${t}</h3>${html}</div>`).join('')
      + `<div class="modal-section" id="modalSeason"><h3>${playerYear} Season</h3><div class="modal-empty">Loading…</div></div>`;
    const groups = [];
    if (row.bat) groups.push('hitting');
    if (row.pit) groups.push('pitching');
    const results = await Promise.all(groups.map(g => seasonStat(pid, g, playerYear).catch(() => null)));
    if (currentIndex.get(String(pid)) !== row) return;  // series changed while this was in flight
    const html = groups.map((g, i) => g === 'hitting' ? apiBattingBlock(results[i]) : apiPitchingBlock(results[i])).join('');
    const sec = $('modalSeason'); if (sec) sec.innerHTML = `<h3>${playerYear} Season</h3>${html || '<div class="modal-empty">No data.</div>'}`;
  } else {
    // preview mode: h2h vs this opponent + full season, both already loaded
    ['hitting','pitching'].forEach(gr => {
      if (!row[gr]) return;
      const a = row[gr].a, b = row[gr].b;
      parts.push([`Vs opponent this season`, gr === 'hitting' ? apiBattingBlock(a) : apiPitchingBlock(a)]);
      parts.push([`${playerYear} season · all`, gr === 'hitting' ? apiBattingBlock(b) : apiPitchingBlock(b)]);
    });
    $('modalBody').innerHTML = parts.length
      ? parts.map(([t, html]) => `<div class="modal-section"><h3>${t}</h3>${html}</div>`).join('')
      : `<div class="modal-empty">No stats available yet.</div>`;
  }
}


// ---- broadcast graphic: a lower-third PNG, drawn on canvas so it needs no external assets ----

// Pull the most broadcast-relevant stat line for whichever player/mode is on screen.
// Batting counting stats are dynamic: anything the player actually did (HR, RBI, R, SB, HBP) shows up;
// an 0-for-4 with no extra-base stuff falls back to the familiar HR/RBI pair so it still reads clean.
function notableBattingCells(s) {
  const candidates = [['HR', +s.homeRuns || 0], ['RBI', +s.rbi || 0], ['R', +s.runs || 0],
                       ['SB', +s.stolenBases || 0], ['HBP', +s.hitByPitch || 0]];
  const nonzero = candidates.filter(([, v]) => v > 0);
  return nonzero.length ? nonzero : candidates.slice(0, 2);
}

function seriesGraphicData(row) {
  if (indexMode !== 'played') return null;  // an upcoming series hasn't happened yet — nothing to pull
  const splitLabel = row.oppAbbr ? `Series vs. ${row.oppAbbr}` : 'Series';
  if (row.bat) return { label: splitLabel, splitLabel, hitLine: `${row.bat.hits}-for-${row.bat.atBats}`, cells: [
    ['AVG', avg(row.bat)], ['OBP', obpStr(row.bat)], ['SLG', rate(row.bat.totalBases, row.bat.atBats)],
    ['OPS', opsStr(row.bat)], ...notableBattingCells(row.bat) ] };
  if (row.pit) return { label: splitLabel, splitLabel, cells: [
    ['IP', ip(row.pit.outs)], ['ER', row.pit.earnedRuns], ['H', row.pit.hits],
    ['BB', row.pit.baseOnBalls], ['K', row.pit.strikeOuts], ['HR', row.pit.homeRuns],
    ['Pit', row.pit.pitchesThrown] ] };
  return null;
}

// Any split besides the plain full season always goes through fetchSplitStat, even in preview
// mode where the plain season stat is already preloaded — no point special-casing just that one.
// vs LHP/RHP for a hitter is vs LHB/RHB for a pitcher — same sitCode, different label
function splitDisplayName(splitKey, isPitcher) {
  if (splitKey === 'vsL') return isPitcher ? 'vs LHB' : 'vs LHP';
  if (splitKey === 'vsR') return isPitcher ? 'vs RHB' : 'vs RHP';
  if (splitKey.startsWith('custom:')) return `Since ${mmdd(splitKey.slice(7))}`;
  return SPLITS.find(([k]) => k === splitKey)[1];
}

async function seasonGraphicData(row, pid, splitKey = 'season') {
  let bat = null, pit = null;
  const wantBat = indexMode === 'played' ? !!row.bat : !!row.hitting;
  const wantPit = indexMode === 'played' ? !!row.pit : !!row.pitching;
  if (splitKey === 'season' && indexMode !== 'played') {
    bat = row.hitting && row.hitting.b;
    pit = row.pitching && row.pitching.b;
  } else {
    if (wantBat) bat = await fetchSplitStat(pid, 'hitting', splitKey, playerYear).catch(() => null);
    if (wantPit) pit = await fetchSplitStat(pid, 'pitching', splitKey, playerYear).catch(() => null);
  }
  if (bat) {
    const splitName = splitDisplayName(splitKey, false);
    // vs a specific handedness the sample's small enough that HR is worth showing even at zero —
    // the dynamic notable-stat picker is for a single series, not a full-season platoon split
    const extra = (splitKey === 'vsL' || splitKey === 'vsR')
      ? [['HR', +bat.homeRuns || 0], ['RBI', +bat.rbi || 0]]
      : notableBattingCells(bat);
    const cells = [['AVG', bat.avg], ['OBP', bat.obp], ['SLG', bat.slg], ['OPS', bat.ops],
      ['K%', kRate(bat, 'plateAppearances')], ['BB%', bbRate(bat, 'plateAppearances')], ...extra];
    return { label: `${playerYear} · ${splitName}`, splitLabel: splitName, hitLine: `${bat.hits}-for-${bat.atBats}`, cells };
  }
  if (pit) {
    const splitName = splitDisplayName(splitKey, true);
    return { label: `${playerYear} · ${splitName}`, splitLabel: splitName, cells: [
      ['IP', pit.inningsPitched], ['ERA', pit.era], ['WHIP', pit.whip], ['W-L', `${pit.wins}-${pit.losses}`],
      ['K%', kRate(pit, 'battersFaced')], ['BB%', bbRate(pit, 'battersFaced')] ] };
  }
  return null;
}

// Loads an image and proves it won't taint the canvas before we commit to using it —
// some CDNs omit CORS headers, and we'd rather ship a graphic without a photo than fail the export.
function loadSafeImage(src) {
  return new Promise(resolve => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      try {
        const t = document.createElement('canvas'); t.width = t.height = 2;
        t.getContext('2d').drawImage(img, 0, 0, 2, 2);
        t.toDataURL();
        resolve(img);
      } catch { resolve(null); }
    };
    img.onerror = () => resolve(null);
    img.src = src;
  });
}

// Draws the shared lower-third layout for whatever stat line is passed in, returns the canvas
// plus whether the headshot actually made it in (so the caller can note a CORS fallback).
async function renderLowerThird(data, row, pid) {
  await Promise.all([
    document.fonts.load('64px Anton'),
    document.fonts.load('700 18px "Sofia Sans Extra Condensed"'),
    document.fonts.load('800 40px "Sofia Sans Extra Condensed"'),
  ]);
  const img = await loadSafeImage(headshotURL(pid));

  // Full 1920x1080 broadcast-safe canvas, transparent everywhere except the bar itself, which
  // sits at the same bottom-anchored spot as the live OBS display (?display=1) — import this PNG
  // once as a full-canvas source in OBS and it always lands in the same place, no repositioning.
  const CW = 1920, CH = 1080, W = 1920, H = 200, BOTTOM_MARGIN = 60;
  const canvas = document.createElement('canvas'); canvas.width = CW; canvas.height = CH;
  const ctx = canvas.getContext('2d');
  ctx.translate(0, CH - H - BOTTOM_MARGIN);

  ctx.fillStyle = '#0E2340'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(255,255,255,.05)'; ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 26) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  ctx.fillStyle = '#F5F7FA'; ctx.fillRect(0, 0, W, 5);

  const cx = 112, cy = H / 2, r = 76;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.closePath();
  if (img) {
    ctx.save(); ctx.clip();
    const size = r * 2, scale = Math.max(size / img.width, size / img.height);
    const iw = img.width * scale, ih = img.height * scale;
    ctx.drawImage(img, cx - iw / 2, cy - ih / 2, iw, ih);
    ctx.restore();
  } else {
    ctx.fillStyle = '#153157'; ctx.fill();
    ctx.fillStyle = '#93a5c2'; ctx.font = '700 16px "Sofia Sans Extra Condensed"';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('NO PHOTO', cx, cy);
  }
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.lineWidth = 5; ctx.strokeStyle = '#F5F7FA'; ctx.stroke();

  const nx = 226, divX = 560;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#F5F7FA';
  // the name column is narrower now that the stats reclaimed some of its width — shrink long
  // names down rather than letting them run into the divider
  let nameSize = 62;
  ctx.font = `${nameSize}px Anton`;
  const nameMaxW = divX - nx - 20;
  while (nameSize > 36 && ctx.measureText(row.name.toUpperCase()).width > nameMaxW)
    ctx.font = `${nameSize -= 2}px Anton`;
  ctx.fillText(row.name.toUpperCase(), nx, 100);
  ctx.fillStyle = '#93a5c2'; ctx.font = '700 20px "Sofia Sans Extra Condensed"';
  ctx.fillText([row.pos, row.team].filter(Boolean).join('  ·  ').toUpperCase(), nx, 130);

  ctx.strokeStyle = '#26426e'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(divX, 34); ctx.lineTo(divX, H - 34); ctx.stroke();

  const startX = divX + 30, avail = W - 30 - startX;
  // split name (white, e.g. "LAST 30 DAYS") and the hits-for-AB count (faded, e.g. "12-FOR-72")
  // sit side by side above the stat cells — either can be absent (series has no split; a
  // pitcher's split has no hits-for-AB) and the other still centers correctly on its own
  if (data.splitLabel || data.hitLine) {
    ctx.font = '700 22px "Sofia Sans Extra Condensed"';
    const parts = [];
    if (data.splitLabel) parts.push({ text: data.splitLabel.toUpperCase(), color: '#F5F7FA' });
    if (data.hitLine) parts.push({ text: data.hitLine.toUpperCase(), color: '#93a5c2' });
    const sep = '   ·   ';
    const widths = parts.map(p => ctx.measureText(p.text).width);
    const sepW = ctx.measureText(sep).width;
    let x = startX + avail / 2 - (widths.reduce((a, b) => a + b, 0) + sepW * (parts.length - 1)) / 2;
    ctx.textAlign = 'left';
    parts.forEach((p, i) => {
      ctx.fillStyle = p.color; ctx.fillText(p.text, x, 26); x += widths[i];
      if (i < parts.length - 1) { ctx.fillStyle = '#93a5c2'; ctx.fillText(sep, x, 26); x += sepW; }
    });
  }
  // Size the whole row together (not cell-by-cell) so every stat stays the same scale, and
  // shrink only as far as needed to keep it on one line — then space the cells like flex's
  // space-between: edge to edge, using every pixel of room instead of clustering with margin
  // left over. Each cell's own footprint is the wider of its value or its label.
  const cellWidths = size => {
    const ls = Math.round(size * 0.32);
    return data.cells.map(([label, value]) => {
      ctx.font = `800 ${size}px "Sofia Sans Extra Condensed"`;
      const vw = ctx.measureText(String(value)).width;
      ctx.font = `700 ${ls}px "Sofia Sans Extra Condensed"`;
      const lw = ctx.measureText(label).width;
      return Math.max(vw, lw);
    });
  };
  let valueSize = 85, widths = cellWidths(valueSize);
  while (valueSize > 40 && widths.reduce((a, b) => a + b, 0) > avail) {
    widths = cellWidths(valueSize -= 4);
  }
  const labelSize = Math.max(16, Math.round(valueSize * 0.32));
  const n = data.cells.length, totalContent = widths.reduce((a, b) => a + b, 0);
  const MAX_GAP = 100;
  let gapEach = n > 1 ? (avail - totalContent) / (n - 1) : 0;
  let cellX = startX;
  if (gapEach > MAX_GAP) {
    // too few/narrow stats to justify spreading edge to edge — cluster with a normal gap and
    // center the tighter group instead, rather than stranding cells far apart
    gapEach = MAX_GAP;
    const groupW = totalContent + gapEach * (n - 1);
    cellX = startX + (avail - groupW) / 2;
  }
  data.cells.forEach(([label, value], i) => {
    const x = cellX + widths[i] / 2;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#F5F7FA'; ctx.font = `800 ${valueSize}px "Sofia Sans Extra Condensed"`;
    ctx.fillText(String(value), x, H / 2 + 22);
    ctx.fillStyle = '#93a5c2'; ctx.font = `700 ${labelSize}px "Sofia Sans Extra Condensed"`;
    ctx.fillText(label, x, H / 2 + 44);
    cellX += widths[i] + gapEach;
  });

  ctx.textAlign = 'right'; ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.font = '700 14px "Sofia Sans Extra Condensed"';
  ctx.fillText("TALKIN' YANKS", W - 20, H - 14);

  return { canvas, hadPhoto: !!img };
}

// ---- on-air: push a player's stat line to the OBS display view (control side) ----

let onAirPid = null, onAirSplit = 'series';

function pushOnAir(pid, row, data, splitKey) {
  if (!row || !data) return;
  const kind = splitKey === 'series' ? 'series' : 'season';
  onAirPid = pid; onAirSplit = splitKey;
  const payload = { pid, kind, splitKey, name: row.name, pos: row.pos, team: row.team, data, ts: Date.now() };
  try { localStorage.setItem(LT_KEY, JSON.stringify(payload)); } catch {}
  if (ltChannel) ltChannel.postMessage(payload);
  updateOnAirUI(payload);
}

function clearOnAir() {
  onAirPid = null; onAirSplit = 'series';
  try { localStorage.removeItem(LT_KEY); } catch {}
  if (ltChannel) ltChannel.postMessage({ clear: true });
  updateOnAirUI(null);
}

function updateOnAirUI(payload) {
  const box = $('onair'); if (!box) return;
  box.hidden = !payload;
  if (payload) $('onairText').innerHTML = `On air: <b>${payload.name}</b> · ${payload.data.label}`;
}

// Clicking a tab shows up on the display right away — same fetch downloadGraphic does, just
// without the canvas/PNG work, since most tab clicks are someone browsing rather than about to
// hit download. Guards against a stale modal (closed, or switched to a different player) landing
// a late fetch on the wrong on-air line. "This Series" is already loaded, so that one's instant.
async function pushSplit(pid, splitKey) {
  const row = currentIndex.get(String(pid));
  if (!row || pid !== modalPid) return;
  const note = $('modalDlNote');
  if (splitKey === 'series') {
    const data = seriesGraphicData(row);
    if (data) { pushOnAir(pid, row, data, 'series'); note.textContent = ''; }
    else note.textContent = 'No series stats available.';
    return;
  }
  const isPitcher = indexMode === 'played' ? !!row.pit && !row.bat : !!row.pitching && !row.hitting;
  note.textContent = 'Updating display…';
  const data = await seasonGraphicData(row, pid, splitKey).catch(() => null);
  if (pid !== modalPid || modalSplitKey !== splitKey) return;  // modal moved on while this was in flight
  if (data) { pushOnAir(pid, row, data, splitKey); note.textContent = ''; }
  else note.textContent = `No ${splitDisplayName(splitKey, isPitcher).toLowerCase()} stats available.`;
}

// ---- OBS display view (?display=1): renders whatever the control page last pushed, and keeps
// itself current — the control page re-pushes on every live-refresh tick while a game is in progress ----

function renderOnAirBar(payload) {
  const bar = $('ltBar');
  if (!bar) return;
  if (!payload) { bar.hidden = true; return; }
  const { name, pos, team, data } = payload;
  bar.hidden = false;
  $('ltHeadshot').src = headshotURL(payload.pid);
  $('ltName').textContent = name.toUpperCase();
  $('ltSub').textContent = [pos, team].filter(Boolean).join('  ·  ').toUpperCase();
  const hitEl = $('ltHitline');
  const bits = [
    data.splitLabel ? `<span class="lt-splitlabel">${data.splitLabel.toUpperCase()}</span>` : '',
    data.hitLine ? `<span class="lt-hitcount">${data.hitLine.toUpperCase()}</span>` : '',
  ].filter(Boolean);
  hitEl.innerHTML = bits.join('  ·  ');
  hitEl.style.display = bits.length ? '' : 'none';
  const cellsEl = $('ltCells');
  // measure the real space instead of assuming a fixed width — an assumption that doesn't match
  // the actual rendered container is exactly what let cells wrap to a second line before
  const availW = cellsEl.parentElement.clientWidth || 1300;
  // Size the whole row together (not cell-by-cell) so every stat stays the same scale, and
  // shrink only as far as needed to keep it on one line — space-between (in CSS) then spreads
  // the now-content-sized cells edge to edge, using every pixel of room instead of clustering
  // with margin left over.
  let valueSize = 85;
  cellsEl.innerHTML = data.cells.map(([label, value]) =>
    `<div class="lt-cell">
       <div class="v" style="font-size:${valueSize}px">${value}</div>
       <div class="k" style="font-size:${Math.round(valueSize * 0.32)}px">${label}</div>
     </div>`).join('');
  while (valueSize > 40 && cellsEl.scrollWidth > availW) {
    valueSize -= 4;
    cellsEl.querySelectorAll('.v').forEach(v => v.style.fontSize = valueSize + 'px');
    cellsEl.querySelectorAll('.k').forEach(k => k.style.fontSize = Math.round(valueSize * 0.32) + 'px');
  }
  // too few/narrow stats to justify spreading edge to edge (a pitcher's short series line, say)
  // — cluster with a normal gap and center the tighter group instead of stranding cells far apart
  const cells = [...cellsEl.querySelectorAll('.lt-cell')];
  const totalContent = cells.reduce((a, c) => a + c.offsetWidth, 0);
  const n = cells.length, MAX_GAP = 100;
  const idealGap = n > 1 ? (availW - totalContent) / (n - 1) : 0;
  if (idealGap > MAX_GAP) {
    cellsEl.style.justifyContent = 'center';
    cellsEl.style.gap = MAX_GAP + 'px';
  } else {
    cellsEl.style.justifyContent = 'space-between';
    cellsEl.style.gap = '0px';
  }
}


function initDisplay() {
  try {
    const cached = JSON.parse(localStorage.getItem(LT_KEY) || 'null');
    if (cached) renderOnAirBar(cached);
  } catch {}
  if (ltChannel) ltChannel.onmessage = e => renderOnAirBar(e.data && e.data.clear ? null : e.data);
  window.addEventListener('storage', e => {
    if (e.key !== LT_KEY) return;
    try { renderOnAirBar(e.newValue ? JSON.parse(e.newValue) : null); } catch {}
  });
}

// Build the graphic for the open player, whichever tab was active. The download always completes
// even if the modal's moved on by the time the fetch resolves, but the on-air push is skipped in
// that case — a finished download shouldn't retroactively hijack the live display.
async function buildGraphic(pid, row, splitKey) {
  const data = splitKey === 'series' ? seriesGraphicData(row) : await seasonGraphicData(row, pid, splitKey);
  if (!data) return null;
  if (pid === modalPid) pushOnAir(pid, row, data, splitKey);
  return renderLowerThird(data, row, pid);
}

async function downloadGraphic() {
  const pid = modalPid, row = currentIndex.get(String(pid)), splitKey = modalSplitKey;
  const isPitcher = indexMode === 'played' ? !!row.pit && !row.bat : !!row.pitching && !row.hitting;
  const label = splitDisplayName(splitKey, isPitcher);
  const btn = $('modalDownload'), note = $('modalDlNote');
  if (!row) return;

  btn.disabled = true; note.textContent = `Building ${label} graphic…`;
  try {
    const built = await buildGraphic(pid, row, splitKey);
    if (!built) { note.textContent = `No ${label.toLowerCase()} stats available to build a graphic yet.`; return; }
    const { canvas, hadPhoto } = built;
    const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
    if (!blob) throw new Error('Canvas export failed');
    const a = el('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${row.name.replace(/[^\w\d]+/g, '-')}-${splitKey.replace(/[^\w\d]+/g, '-')}-lower-third.png`;
    a.click(); URL.revokeObjectURL(a.href);
    note.textContent = hadPhoto ? 'Downloaded ✓' : 'Downloaded ✓ (headshot host blocked embedding — graphic saved without it)';
  } catch (e) {
    note.textContent = 'Could not build the graphic: ' + e.message;
  } finally {
    btn.disabled = false;
  }
}


async function loadSeries() {
  const y = $('season').value, id = teamId();
  $('series').innerHTML = '<option>—</option>'; $('out').innerHTML = '';
  setMatchup(null);
  say('Loading schedule…');
  const d = await j(`${API}/schedule?sportId=1&teamId=${id}&season=${y}&gameType=R,F,D,L,W&hydrate=probablePitcher`);
  const games = d.dates.flatMap(x => x.games)
    .filter(g => g.status.codedGameState !== 'D')  // postponed: no box score, no future date either
    .sort((a,b) => (a.officialDate + a.gameNumber).localeCompare(b.officialDate + b.gameNumber));

  const all = [];
  for (const g of games) {
    const home = g.teams.home.team.id === id;
    const opp = home ? g.teams.away.team : g.teams.home.team;
    // regular season: a series is one venue, so home/away splits it. Postseason: whole round is one series.
    const key = opp.id + g.gameType + (g.gameType === 'R' ? (home ? 'H' : 'A') : '');
    const last = all[all.length-1];
    if (last && last.key === key) last.games.push(g);
    else all.push({ key, home, opp, games: [g], type: g.gameType });
  }
  // F=final, O=game over, I=in progress — anything else hasn't produced a box score yet
  all.forEach(s => {
    s.played = s.games.filter(g => 'FOI'.includes(g.status.codedGameState));
    s.future = !s.played.length;
  });
  series = all;  // chronological, opening day → end of season

  if (!series.length) { say('No games for that season.'); return; }
  $('series').innerHTML = series.map((s, i) => {
    const g = s.future ? s.games : s.played;
    const a = g[0].officialDate, b = g[g.length-1].officialDate;
    const dates = a === b ? mmdd(a) : mmdd(a) + '–' + mmdd(b);
    const tag = s.future ? ' ▸ UPCOMING'
              : s.type === 'R' ? '' : ' [' + ({F:'WC',D:'DS',L:'CS',W:'WS'}[s.type] || s.type) + ']';
    const at = s.type === 'R' ? (s.home ? 'vs' : '@') : 'vs';
    return `<option value="${i}">${dates} ${at} ${s.opp.name} (${g.length})${tag}</option>`;
  }).join('');
  // open on the latest played series — the boundary between past and upcoming
  $('series').value = Math.max(0, series.findLastIndex(s => !s.future));
  render();
}

function say(msg, isErr) { $('status').textContent = msg; $('status').className = isErr ? 'err' : ''; $('status').style.display = msg ? '' : 'none'; }

async function render() {
  const sel = series[+$('series').value];
  if (!sel) return;
  setMatchup(sel.opp.id, sel.opp.name);
  $('out').innerHTML = ''; $('viewchips').innerHTML = '';
  paintFn = null;
  clearTimeout(liveTimer); liveTimer = null;  // dropped if the new selection has nothing live; re-armed below
  if (sel.future) return renderPreview(sel);
  const s = { ...sel, games: sel.played };  // drop any not-yet-played game in a live series
  say(`Loading ${s.games.length} box score${s.games.length>1?'s':''}…`);
  const boxes = await Promise.all(s.games.map(g => j(`${API}/game/${g.gamePk}/boxscore`)));
  const skipped = sel.games.length - s.games.length;
  const live = s.games.some(g => g.status.codedGameState === 'I');
  say([skipped ? `${skipped} game${skipped>1?'s':''} in this series not played yet.` : '',
       live && LIVE_REFRESH ? `Live — updated ${new Date().toLocaleTimeString()}, refreshing every ${LIVE_MS/1000}s` : '']
      .filter(Boolean).join(' · '));

  paintFn = () => paintPlayed(s, boxes);
  repaint();
  armLive(sel);
}

function paintPlayed(s0, allBoxes) {
  // Hiding a game collapses its columns to a thin 1-col stub — it never leaves the table, so
  // there's always something right there to click back open. Sums are still built from every
  // box score regardless (see below), so a collapsed game still counts toward every total.
  const gLabels = s0.games.map((g, i) => 'G' + (i + 1));
  const shownIdx = gLabels.map((l, i) => i).filter(i => !hset('game').has(gLabels[i]));
  const s = { ...s0, games: s0.games, gidx: s0.games.map((_, i) => i), gtotal: s0.games.length };

  // Yankees always render first; the 'away' slot below just means "first section"
  const t0 = allBoxes[0].teams;
  const teamsMeta = t0.home.team.id === teamId() ? [t0.home.team, t0.away.team]
                                                : [t0.away.team, t0.home.team];
  const slots = [0, 1].filter(ti => !hset('team').has(teamsMeta[ti].name));

  chipRow('Games', gLabels, 'game');
  chipRow('Teams', teamsMeta.map(t => t.name), 'team');
  chipRow('Batting', [...BAT.map(c => c[1]), 'AVG', 'OBP', 'SLG', 'OPS', 'GIDP'], 'bat');
  chipRow('Pitching', [...PIT.map(c => c[1]), 'ERA'], 'pit');
  chipRow('Pitcher usage', [...PITG.map(c => c[1]), 'ERA'], 'pitg');
  chipRow('Team batting', TEAM_BAT_ROWS.map(r => r[0]), 'tbat');
  chipRow('Team pitching', TEAM_PIT_ROWS.map(r => r[0]), 'tpit');

  indexMode = 'played';
  playerYear = $('season').value;
  currentIndex = new Map();

  if (!slots.length) {
    addTable('Nothing to show', null, 'Both teams are hidden. Turn one back on above.');
    return;
  }

  // players[slot] = Map(personId → {name, pos, order, pIdx, g:{gi:stats}, bat:{sums}, pit:{sums}})
  // teamGames[slot][gi] = flat raw team line (summable; rates derived from these)
  // gi is the game's index in the FULL series, so hidden games still count toward the sums
  const players = { away: new Map(), home: new Map() };
  const teamGames = { away: [], home: [] };
  allBoxes.forEach((b, gi) => SD.forEach(sd => {
    const T = b.teams[sd];
    // if a team flips home/away across the series, follow team id, not the slot
    const slot = T.team.id === teamsMeta[0].id ? 'away' : 'home';
    teamGames[slot][gi] = teamLine(T);
    const map = players[slot];
    Object.values(T.players).forEach(p => {
      const st = p.stats || {};
      if (!filled(st.batting) && !filled(st.pitching)) return;
      let row = map.get(p.person.id);
      if (!row) {
        row = { id: p.person.id, name: p.person.fullName, pos: p.position?.abbreviation || '',
                ord: { gi: -1, slot: 9999 }, pIdx: 999, g: {}, bat: null, pit: null };
        map.set(p.person.id, row);
      }
      // batting order from the most recent game the player hit in. battingOrder is "400" for the
      // cleanup starter and "401" for whoever replaced him, so subs slot in behind their starter.
      if (p.battingOrder && gi >= row.ord.gi) row.ord = { gi, slot: +p.battingOrder };
      const pi = T.pitchers.indexOf(p.person.id);
      if (pi >= 0) row.pIdx = Math.min(row.pIdx, gi * 100 + pi);
      row.g[gi] = st;
      if (filled(st.batting)) row.bat = sum(row.bat, st.batting, BAT_SUM);
      if (filled(st.pitching)) {
        row.pit = sum(row.pit, st.pitching, PIT_SUM);
        row.gs = (row.gs || 0) + (+st.pitching.gamesStarted || 0);  // splits starters from relievers
      }
    });
  }));

  if (anyShown('bat', [...BAT.map(c => c[1]), 'AVG', 'OBP', 'OPS']))
    addTable('Batting', buildTable('bat', shown('bat', BAT), s, players, teamsMeta, slots));
  if (anyShown('pit', [...PIT.map(c => c[1]), 'ERA']))
    addTable('Pitching', buildTable('pit', shown('pit', PIT), s, players, teamsMeta, slots));

  const pgCols = shown('pitg', PITG), pgERA = !hset('pitg').has('ERA');
  if (pgCols.length || pgERA) {
    // a hidden game loses its block here — there's no column to fold it into
    if (shownIdx.length) addTable('Pitchers by Game', buildPitByGame(gameBlocks(allBoxes, s0.games, shownIdx, teamsMeta, slots), pgCols, pgERA));
    addTable('Pitchers by Role', buildPitBlocks(roleBlocks(players, teamsMeta, slots), pgCols, pgERA));
  }

  const tb = shown('tbat', TEAM_BAT_ROWS, 0), tp = shown('tpit', TEAM_PIT_ROWS, 0);
  if (tb.length) addTable('Team Batting', buildTeamTable(s, teamGames, teamsMeta, 'bat', tb, 'SERIES', slots));
  if (tp.length) addTable('Team Pitching', buildTeamTable(s, teamGames, teamsMeta, 'pit', tp, 'SERIES', slots));

  SD.forEach((sd, ti) => players[sd].forEach((row, pid) =>
    currentIndex.set(String(pid), { ...row, team: teamsMeta[ti].name, oppAbbr: teamsMeta[ti === 0 ? 1 : 0].abbreviation })));
  applyFilter();  // a name typed in Find survives a series change
  paintSortLight();
}

// ---- pitching organised by who was used, game by game (mirrors the scoresheet's per-game blocks) ----

const PITG = [['outs','IP'],['hits','H'],['runs','R'],['earnedRuns','ER'],['baseOnBalls','BB'],
              ['strikeOuts','K'],['homeRuns','HR'],['pitchesThrown','Pit']];
const PIT_SUM = [...PIT, ['pitchesThrown','Pit']];   // Pit is only shown in the usage tables, but always summed

// G3 · Aug 2 · W 9-5, from the Yankees' point of view
const gLabel = (g, n) => {
  const home = g.teams.home, away = g.teams.away;
  const me = home.team.id === teamId() ? home : away, opp = me === home ? away : home;
  const wl = me.score > opp.score ? 'W' : me.score < opp.score ? 'L' : 'T';
  const live = g.status.codedGameState === 'I';
  return `G${n} · ${mmdd(g.officialDate)} · ${live ? 'LIVE' : wl} ${me.score}-${opp.score}`;
};
const teamSide = (b, meta) => b.teams.away.team.id === meta.id ? b.teams.away : b.teams.home;
const noteCls = n => /^\(W/.test(n) ? 'w' : /^\(L/.test(n) ? 'l' : 'live';   // W/L/S+H/BS colouring

// one entry per (visible) game, each with both teams' pitcher lines ready to sit side by side.
// ti === 0 is always the Yankees slot (teamsMeta[0]) — everything else is the opponent.
function gameBlocks(allBoxes, allGames, gidx, teamsMeta, slots) {
  return gidx.map(gi => ({
    gLabel: gLabel(allGames[gi], gi + 1),
    teams: slots.map(ti => {
      const T = teamSide(allBoxes[gi], teamsMeta[ti]);
      return {
        key: `G${gi + 1} — ${teamsMeta[ti].name}`, label: teamsMeta[ti].name, opp: ti !== 0,
        rows: T.pitchers.map(id => {
          const p = T.players['ID' + id], st = (p.stats && p.stats.pitching) || {};
          return { id, name: p.person.fullName, note: st.note || '', st };
        })
      };
    })
  }));
}

// starters vs bullpen over the whole series, per team
function roleBlocks(players, teamsMeta, slots) {
  return slots.map(ti => ({
    label: teamsMeta[ti].name, total: 'ALL PITCHERS',
    rows: [['STARTERS', r => r.gs], ['RELIEVERS', r => !r.gs]].map(([lbl, f]) => {
      const g = [...players[SD[ti]].values()].filter(r => r.pit).filter(f);
      return g.length ? { name: lbl, st: g.reduce((a, r) => sum(a, r.pit, PIT_SUM), null) } : null;
    }).filter(Boolean)
  })).filter(b => b.rows.length);
}

// blocks: [{label, total, rows:[{name, note, st}]}] — st is any object with the PITG keys
function buildPitBlocks(blocks, cols, withERA) {
  const table = el('table', 'players');
  table.dataset.tbl = 'pitg';
  // sorting here is within each game's block — the whole point of the table is who came in when
  const act = sortActive('pitg');
  if (act) {
    const c = cols.find(([, l]) => l === act.stat);
    const v = r => act.stat === 'ERA' ? sortNum(era(r.st)) : (c ? +r.st[c[0]] || 0 : null);
    blocks = blocks.map(b => ({ ...b, rows: [...b.rows].sort(sortCmp(act.dir, v)) }));
  }
  const thead = el('thead'), hr = el('tr');
  hr.appendChild(el('th', 'name', 'Pitcher'));
  cols.forEach(([, lbl], i) => hr.appendChild(withStat(el('th', i === 0 ? 'gstart' : '', lbl), lbl)));
  if (withERA) hr.appendChild(withStat(el('th', 'tot tothead', 'ERA'), 'ERA'));
  thead.appendChild(hr); table.appendChild(thead);

  const width = cols.length + (withERA ? 1 : 0);
  const statCells = (tr, st, extra) => {
    cols.forEach(([k, lbl], i) => tr.appendChild(withStat(
      el('td', 'num' + (i === 0 ? ' gstart' : '') + extra + (+st[k] === 0 ? ' z' : ''), cell(k, st)), lbl)));
    if (withERA) tr.appendChild(withStat(el('td', 'num tot', era(st)), 'ERA'));
  };

  const tbody = el('tbody');
  blocks.forEach(b => {
    const trT = el('tr', 'team');
    trT.appendChild(el('td', 'name', b.label));
    const fill = el('td'); fill.colSpan = width; trT.appendChild(fill);
    tbody.appendChild(trT);
    b.rows.forEach(r => {
      const tr = el('tr');
      if (r.id) tr.dataset.pid = r.id;
      const td = el('td', 'name');
      td.appendChild(document.createTextNode(r.name + ' '));
      if (r.note) td.appendChild(el('span', 'note ' + noteCls(r.note), r.note));
      tr.appendChild(td);
      statCells(tr, r.st, '');
      tbody.appendChild(tr);
    });
    if (b.rows.length > 1) {
      const tr = el('tr', 'sum');
      tr.appendChild(el('td', 'name', b.total || 'TOTAL'));
      statCells(tr, b.rows.reduce((a, r) => sum(a, r.st, cols), null), '');
      tbody.appendChild(tr);
    }
  });
  table.appendChild(tbody);
  return table;
}
