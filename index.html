function buildPitByGame(games, cols, withERA) {
  // sorting here is shared across every panel — the whole point is who came in when, game to game
  const act = sortActive('pitg');
  const sortRows = rows => {
    if (!act) return rows;
    const c = cols.find(([, l]) => l === act.stat);
    const v = r => act.stat === 'ERA' ? sortNum(era(r.st)) : (c ? +r.st[c[0]] || 0 : null);
    return [...rows].sort(sortCmp(act.dir, v));
  };

  const wrap = el('div', 'pitgames');
  games.forEach(g => {
    const row = el('div', 'pitgame');
    row.appendChild(el('div', 'pitgame-label', g.gLabel));
    g.teams.forEach(team => {
      const isClosed = collapsedPitTeams.has(team.key);
      const panel = el('div', 'pitteam' + (team.opp ? ' opp' : '') + (isClosed ? ' closed' : ''));
      const head = el('div', 'pitteam-head', team.label + (isClosed ? '  ▸' : '  ▾'));
      head.title = isClosed ? `Click to show ${team.label}'s pitchers` : `Click to collapse ${team.label}'s pitchers`;
      head.onclick = () => {
        collapsedPitTeams.has(team.key) ? collapsedPitTeams.delete(team.key) : collapsedPitTeams.add(team.key);
        repaint();
      };
      panel.appendChild(head);
      if (!isClosed) panel.appendChild(pitTeamTable({ ...team, rows: sortRows(team.rows) }, cols, withERA));
      row.appendChild(panel);
    });
    wrap.appendChild(row);
  });
  return wrap;
}

// "Team RISP = 2-for-17" / "Team LOB = 11" only exist in the boxscore info blocks,
// not in teamStats (teamStats.leftOnBase is the per-batter sum, a different number).
function teamLine(T) {
  const f = {};
  (T.info || []).forEach(sec => (sec.fieldList || []).forEach(x => { if (x.label) f[x.label] = x.value; }));
  const m = /(\d+)-for-(\d+)/.exec(f['Team RISP'] || '');
  const bat = { rispH: m ? +m[1] : 0, rispAB: m ? +m[2] : 0, lob: +(f['Team LOB'] || 0),
                errors: +T.teamStats.fielding.errors || 0 };
  TEAM_BAT_KEYS.forEach(k => bat[k] = +T.teamStats.batting[k] || 0);
  const pit = { pitchers: T.pitchers.length };
  TEAM_PIT_KEYS.forEach(k => pit[k] = +T.teamStats.pitching[k] || 0);
  // teamStats never aggregates inherited runners (always 0) — sum the pitchers' own lines.
  pit.inheritedRunners = pit.inheritedRunnersScored = 0;
  T.pitchers.forEach(id => {
    const st = T.players['ID' + id].stats.pitching || {};
    pit.inheritedRunners += +st.inheritedRunners || 0;
    pit.inheritedRunnersScored += +st.inheritedRunnersScored || 0;
  });
  return { bat, pit };
}

const TEAM_BAT_KEYS = ['atBats','runs','hits','doubles','triples','homeRuns','totalBases','baseOnBalls',
                  'strikeOuts','hitByPitch','sacFlies','stolenBases','groundIntoDoublePlay','plateAppearances'];
const TEAM_PIT_KEYS = ['outs','hits','runs','earnedRuns','homeRuns','baseOnBalls','hitBatsmen','strikeOuts',
                  'battersFaced','pitchesThrown','strikes','groundOuts','airOuts','wildPitches',
                  'inheritedRunners','inheritedRunnersScored','stolenBases','caughtStealing'];
const rate = (n, d) => d ? (n/d).toFixed(3).replace(/^0/,'') : '.---';
const per = (n, d, dp) => d ? (n/d).toFixed(dp) : '-';
const obp = r => (r.hits + r.baseOnBalls + r.hitByPitch) /
                 (r.atBats + r.baseOnBalls + r.hitByPitch + r.sacFlies || 1);
const TEAM_BAT_ROWS = [
  ['R', r => r.runs], ['H', r => r.hits],
  ['2B', r => r.doubles], ['3B', r => r.triples], ['HR', r => r.homeRuns],
  ['XBH', r => r.doubles + r.triples + r.homeRuns],
  ['TB', r => r.totalBases],
  ['RISP', r => `${r.rispH}-for-${r.rispAB}`],
  ['RISP AVG', r => rate(r.rispH, r.rispAB)],
  ['LOB', r => r.lob],
  ['BB', r => r.baseOnBalls], ['K', r => r.strikeOuts],
  ['SB', r => r.stolenBases], ['GIDP', r => r.groundIntoDoublePlay], ['E', r => r.errors],
  ['AVG', r => rate(r.hits, r.atBats)],
  ['OBP', r => rate(r.hits + r.baseOnBalls + r.hitByPitch,
                    r.atBats + r.baseOnBalls + r.hitByPitch + r.sacFlies)],
  ['SLG', r => rate(r.totalBases, r.atBats)],
  ['OPS', r => (obp(r) + (r.atBats ? r.totalBases/r.atBats : 0)).toFixed(3).replace(/^0/,'')],
];

const TEAM_PIT_ROWS = [
  ['IP', r => ip(r.outs)],
  ['H', r => r.hits], ['R', r => r.runs], ['ER', r => r.earnedRuns], ['HR', r => r.homeRuns],
  ['BB', r => r.baseOnBalls], ['HBP', r => r.hitBatsmen], ['K', r => r.strikeOuts],
  ['ERA', r => per(r.earnedRuns * 27, r.outs, 2)],
  ['WHIP', r => per((r.hits + r.baseOnBalls) * 3, r.outs, 2)],
  ['K/9', r => per(r.strikeOuts * 27, r.outs, 1)],
  ['BB/9', r => per(r.baseOnBalls * 27, r.outs, 1)],
  ['K/BB', r => per(r.strikeOuts, r.baseOnBalls, 2)],
  ['BF', r => r.battersFaced],
  ['Pitches', r => r.pitchesThrown],
  ['Strike%', r => rate(r.strikes, r.pitchesThrown)],
  ['P/IP', r => per(r.pitchesThrown * 3, r.outs, 1)],
  ['GO/AO', r => per(r.groundOuts, r.airOuts, 2)],
  ['WP', r => r.wildPitches],
  ['SB-CS allowed', r => `${r.stolenBases}-${r.caughtStealing}`],
  ['Inherited scored', r => `${r.inheritedRunnersScored}-of-${r.inheritedRunners}`],
  ['Pitchers used', r => r.pitchers],
];

function buildTeamTable(s, teamGames, teamsMeta, kind, statRows, totalLabel = 'SERIES', slots = [0, 1]) {
  const table = el('table');
  const thead = el('thead'), hr = el('tr');
  hr.appendChild(el('th', 'name', 'Team'));
  s.games.forEach((g, i) => hr.appendChild(gameHead(g, gPos(s, i) + 1, 'gstart' + gTint(i))));
  const tt = el('th', 'tot tothead gstart');
  tt.appendChild(el('div', 'glabel', totalLabel));
  tt.appendChild(el('div', null, `${s.gtotal || s.games.length} G`));
  hr.appendChild(tt);
  thead.appendChild(hr); table.appendChild(thead);

  const tbody = el('tbody');
  slots.forEach(ti => {
    const sd = SD[ti];
    const trT = el('tr', 'team');
    trT.appendChild(el('td', 'name', teamsMeta[ti].name));
    const fill = el('td'); fill.colSpan = s.games.length + 1;
    trT.appendChild(fill); tbody.appendChild(trT);

    const all = teamGames[sd].map(g => g[kind]);
    const total = all.reduce((a, r) => {   // whole series, hidden games included
      Object.keys(r).forEach(k => a[k] = (a[k] || 0) + r[k]);
      return a;
    }, {});
    const games = s.games.map((g, i) => all[gPos(s, i)]);
    statRows.forEach(([label, fn]) => {
      const tr = el('tr');
      tr.appendChild(el('td', 'name', label));
      games.forEach((r, i) => {
        const n = gPos(s, i) + 1;
        tr.appendChild(hset('game').has('G' + n)
          ? thinCell('td', n, 'num gstart')
          : el('td', 'num gstart' + gTint(i), String(fn(r))));
      });
      tr.appendChild(el('td', 'num tot gstart', String(fn(total))));
      tbody.appendChild(tr);
    });
  });
  table.appendChild(tbody);
  return table;
}

// ---- upcoming series: season stats vs that opponent, per player ----

const jCache = new Map();  // splits and rosters don't change mid-session
const jc = u => (jCache.has(u) ? jCache.get(u) : (jCache.set(u, j(u)), jCache.get(u)));

const H2H_COLS = [['gamesPlayed','G'],['atBats','AB'],['runs','R'],['hits','H'],['doubles','2B'],['triples','3B'],
                  ['homeRuns','HR'],['rbi','RBI'],['baseOnBalls','BB'],['strikeOuts','K'],['stolenBases','SB'],
                  ['avg','AVG'],['obp','OBP'],['slg','SLG'],['ops','OPS']];
const SEA_COLS = [['gamesPlayed','G'],['atBats','AB'],['homeRuns','HR'],['rbi','RBI'],['avg','AVG'],['ops','OPS']];
// a pitcher's vs-team split is the opposing batters' line against him — no IP/ERA in it
const H2HP_COLS = [['gamesPlayed','G'],['atBats','AB'],['hits','H'],['doubles','2B'],['homeRuns','HR'],
                   ['baseOnBalls','BB'],['strikeOuts','K'],['avg','AVG'],['obp','OBP'],['slg','SLG'],['ops','OPS']];
const SEAP_COLS = [['gamesPlayed','G'],['inningsPitched','IP'],['era','ERA'],['whip','WHIP'],
                   ['strikeOuts','K'],['baseOnBalls','BB'],['avg','AVG']];

async function renderPreview(s) {
  const y = $('season').value;
  const opp = s.opp;
  setMatchup(opp.id, opp.name);
  const teams = [{ id: teamId(), name: teamName(), vs: opp.id }, { id: opp.id, name: opp.name, vs: teamId() }];

  say('Loading rosters…');
  const rosters = await Promise.all(teams.map(t => jc(`${API}/teams/${t.id}/roster?rosterType=active&season=${y}`)));
  // seasonMap[teamIdx][group] = Map(personId → stat)
  const seasonMap = await Promise.all(teams.map(async t => {
    const [h, p] = await Promise.all(['hitting','pitching'].map(gr =>
      jc(`${API}/stats?stats=season&group=${gr}&season=${y}&teamId=${t.id}&sportId=1&playerPool=ALL&limit=200`)));
    return { hitting: splitMap(h), pitching: splitMap(p) };
  }));

  const people = teams.map((t, ti) => rosters[ti].roster.map(p => ({
    id: p.person.id, name: p.person.fullName, pos: p.position.abbreviation,
    pitcher: p.position.abbreviation === 'P' || p.position.abbreviation === 'TWP',
    hitter: p.position.abbreviation !== 'P',
  })));

  const n = people.flat().length;
  say(`Loading ${n} season-vs-${opp.abbreviation || 'opp'} splits…`);
  await Promise.all(people.flatMap((roster, ti) => roster.map(async p => {
    p.h2h = {};
    await Promise.all([p.hitter && 'hitting', p.pitcher && 'pitching'].filter(Boolean).map(async gr => {
      const d = await jc(`${API}/people/${p.id}/stats?stats=vsTeamTotal&opposingTeamId=${teams[ti].vs}&season=${y}&group=${gr}`);
      const sec = (d.stats || []).find(x => x.type?.displayName === 'vsTeamTotal');
      p.h2h[gr] = sec && sec.splits.length ? sec.splits[0].stat : null;
    }));
  })));

  // team totals for this matchup come from every game already played against them this season
  const priors = series.filter(x => x.opp.id === opp.id).flatMap(x => x.played);
  let priorBoxes = [];
  if (priors.length) {
    say(`Loading ${priors.length} head-to-head box score${priors.length>1?'s':''}…`);
    priorBoxes = await Promise.all(priors.map(g => jc(`${API}/game/${g.gamePk}/boxscore`)));
  }
  say('');

  paintFn = () => paintPreview(s, y, opp, teams, people, seasonMap, priors, priorBoxes);
  repaint();
}

function paintPreview(s, y, opp, teams, people, seasonMap, priors, priorBoxes) {
  chipRow('Teams', teams.map(t => t.name), 'team');
  chipRow('Hitters · vs opp', H2H_COLS.map(c => c[1]), 'hbat');
  chipRow('Hitters · season', SEA_COLS.map(c => c[1]), 'sbat');
  chipRow('Pitchers · vs opp', H2HP_COLS.map(c => c[1]), 'hpit');
  chipRow('Pitchers · season', SEAP_COLS.map(c => c[1]), 'spit');
  chipRow('Team batting', TEAM_BAT_ROWS.map(r => r[0]), 'tbat');
  chipRow('Team pitching', TEAM_PIT_ROWS.map(r => r[0]), 'tpit');

  // probable pitchers, when the API has posted them
  addTable(`Upcoming · ${teamName()} ${s.home ? 'vs' : '@'} ${opp.name}`, null,
    s.games.map((g, i) => {
      const pa = g.teams.away.probablePitcher, ph = g.teams.home.probablePitcher;
      const arm = pa || ph ? ` — ${pa ? pa.fullName : 'TBD'} vs ${ph ? ph.fullName : 'TBD'}` : '';
      return `G${i+1} · ${mmdd(g.officialDate)}  ${g.teams.away.team.name} @ ${g.teams.home.team.name}${arm}`;
    }).join('\n'));

  indexMode = 'preview'; playerYear = y;
  currentIndex = new Map();
  [['hitting', shown('hbat', H2H_COLS), shown('sbat', SEA_COLS), 'Hitters'],
   ['pitching', shown('hpit', H2HP_COLS), shown('spit', SEAP_COLS), 'Pitchers']].forEach(([gr, aCols, bCols, title]) => {
    if (!aCols.length && !bCols.length) return;
    const sections = teams.map((t, ti) => ({
      name: t.name,
      hidden: hset('team').has(t.name),
      rows: people[ti]
        .filter(p => gr === 'hitting' ? p.hitter : p.pitcher)
        .map(p => ({ p, a: p.h2h[gr], b: seasonMap[ti][gr].get(p.id) }))
        .filter(r => r.a || r.b)
        .sort((x, y) => (+(y.a?.atBats) || 0) - (+(x.a?.atBats) || 0) ||
                        (+(y.b?.atBats) || 0) - (+(x.b?.atBats) || 0))
        .map(r => {
          const rec = currentIndex.get(String(r.p.id)) || { id: r.p.id, name: r.p.name, pos: r.p.pos, team: t.name };
          rec[gr] = { a: r.a, b: r.b };
          currentIndex.set(String(r.p.id), rec);
          return { id: r.p.id, name: r.p.name, pos: r.p.pos,
                   cells: [...aCols.map(([k]) => val(r.a, k)), ...bCols.map(([k]) => val(r.b, k))] };
        })
    }));
    const table = buildStrTable(
      [{ label: 'SEASON VS OPPONENT', cols: aCols.map(c => c[1]) },
       { label: `${y} SEASON · ALL`, cols: bCols.map(c => c[1]) }],
      sections.filter(sec => !sec.hidden), title === 'Hitters' ? 'Player' : 'Pitcher', gr);
    addTable(`${title} — season vs series opponent`, table,
      people.flat().some(p => p.h2h[gr]) ? '' : `These teams have not met yet in ${y} — head-to-head columns are empty.`);
  });

  paintTeamBlocks(opp, y, priors, priorBoxes);
  applyFilter();  // a name typed in Find survives a series change
  paintSortLight();
}

// Same Team Batting / Team Pitching tables as a played series, but the columns are
// every game already played against this opponent this season.
function paintTeamBlocks(opp, y, priors, boxes) {
  if (!priors.length) {
    addTable('Team Batting & Pitching', null,
      `No games against ${opp.name} yet in ${y}, so there are no team totals to show.`);
    return;
  }
  const t0 = boxes[0].teams;
  const teamsMeta = t0.home.team.id === teamId() ? [t0.home.team, t0.away.team]
                                                 : [t0.away.team, t0.home.team];
  const teamGames = { away: [], home: [] };
  boxes.forEach((b, gi) => ['away','home'].forEach(sd => {
    const T = b.teams[sd];
    teamGames[T.team.id === teamsMeta[0].id ? 'away' : 'home'][gi] = teamLine(T);
  }));
  const ss = { games: priors };
  const slots = [0, 1].filter(ti => !hset('team').has(teamsMeta[ti].name));
  if (!slots.length) return;
  [['bat', shown('tbat', TEAM_BAT_ROWS, 0), 'Team Batting'],
   ['pit', shown('tpit', TEAM_PIT_ROWS, 0), 'Team Pitching']].forEach(([kind, rows, title]) => {
    if (!rows.length) return;
    addTable(`${title} — ${y} vs ${opp.name}`,
      buildTeamTable(ss, teamGames, teamsMeta, kind, rows, 'SEASON VS ' + opp.name.toUpperCase(), slots));
  });
}

const splitMap = d => new Map(((d.stats || [])[0]?.splits || []).map(sp => [sp.player.id, sp.stat]));
const val = (st, k) => st && st[k] != null && st[k] !== '' ? String(st[k]) : '–';

// generic layout for pre-formatted string cells: column groups over player rows, sectioned by team
function buildStrTable(allGroups, sections, firstColLabel, tbl) {
  const groups = allGroups.filter(g => g.cols.length);   // a fully-hidden column group leaves no header
  const table = el('table', 'players'), thead = el('thead'), r1 = el('tr'), r2 = el('tr');
  table.dataset.tbl = tbl;
  const nameTh = el('th', 'name', firstColLabel); nameTh.rowSpan = 2; r1.appendChild(nameTh);
  const width = groups.reduce((a, g) => a + g.cols.length, 0);
  const flatAt = (gi, ci) => groups.slice(0, gi).reduce((a, g) => a + g.cols.length, 0) + ci;
  groups.forEach((g, gi) => {
    const th = el('th', 'gstart' + (gi ? ' tot tothead' : '')); th.colSpan = g.cols.length;
    th.appendChild(el('div', 'glabel', g.label));
    r1.appendChild(th);
    g.cols.forEach((lbl, ci) => {
      const c = withStat(el('th', (ci === 0 ? 'gstart ' : '') + (gi ? 'tot' : ''), lbl), lbl);
      c.dataset.gi = gi;   // which column group, so the same label in both groups sorts independently
      r2.appendChild(c);
    });
  });
  thead.append(r1, r2); table.appendChild(thead);

  // cells are already-formatted strings, so sort on the parsed value of the clicked column
  const act = sortActive(tbl);
  if (act) {
    const gi = groups.findIndex((g, i) => i === act.gi && g.cols.includes(act.stat));
    if (gi >= 0) {
      const at = flatAt(gi, groups[gi].cols.indexOf(act.stat));
      sections = sections.map(s => ({ ...s, rows: [...s.rows].sort(sortCmp(act.dir, r => sortNum(r.cells[at]))) }));
    }
  }

  const tbody = el('tbody');
  sections.forEach(sec => {
    const trT = el('tr', 'team');
    trT.appendChild(el('td', 'name', sec.name));
    const fill = el('td'); fill.colSpan = width; trT.appendChild(fill);
    tbody.appendChild(trT);
    sec.rows.forEach(r => {
      const tr = el('tr');
      tr.dataset.pid = r.id;
      const td = el('td', 'name');
      td.appendChild(document.createTextNode(r.name + ' '));
      td.appendChild(el('span', 'pos', r.pos));
      tr.appendChild(td);
      let c = 0;
      groups.forEach((g, gi) => g.cols.forEach((lbl, ci) => {
        tr.appendChild(withStat(el('td', 'num' + (ci === 0 ? ' gstart' : '') + (gi ? ' tot' : ''), r.cells[c++]), lbl));
      }));
      tbody.appendChild(tr);
    });
  });
  table.appendChild(tbody);
  return table;
}

// column i shows the game at s.gidx[i] in the full series — every game keeps a slot (gidx is the
// identity map now that collapsing goes thin instead of removing the column), so this mainly
// matters for the "Pitchers by Game" blocks, which still use their own shown-only index.
const gPos = (s, i) => s.gidx ? s.gidx[i] : i;
const gTint = i => i % 2 ? ' gB' : ' gA';   // alternating yellow/blue column blocks, like the scoresheet

// game column header: date + result from the selected team's point of view. Clicking it toggles
// the same hide state as the "View" chips. A collapsed game doesn't leave the table — it shrinks
// to a thin 1-column stub (still clickable, to bring it back) so it's never more than one click away.
function gameHead(g, n, cls, fullSpan = 1) {
  const lbl = 'G' + n;
  const hidden = hset('game').has(lbl);
  const th = el('th', cls + (hidden ? ' gthin' : ' gclick'));
  th.colSpan = hidden ? 1 : fullSpan;
  if (hidden) {
    th.appendChild(el('div', 'gstub', lbl));
    th.title = `Bring ${lbl} back`;
    th.onclick = () => { hset('game').delete(lbl); repaint(); };
    return th;
  }
  const home = g.teams.home, away = g.teams.away;
  const me = home.team.id === teamId() ? home : away;
  const opp = me === home ? away : home;
  const wl = me.score > opp.score ? 'W' : me.score < opp.score ? 'L' : 'T';
  const dh = g.doubleHeader !== 'N' ? ` G${g.gameNumber}` : '';
  th.appendChild(el('div', 'glabel', `G${n} · ${mmdd(g.officialDate)}${dh}`));
  const live = g.status.codedGameState === 'I';
  const res = el('div', 'gres ' + (live ? 'live' : wl === 'W' ? 'w' : wl === 'L' ? 'l' : ''));
  res.textContent = live ? `LIVE ${me.score}-${opp.score}` : `${wl} ${me.score}-${opp.score}`;
  th.appendChild(res);
  th.title = `Click to collapse ${lbl} — it stays part of the series totals, just out of the way`;
  th.onclick = () => { hset('game').add(lbl); repaint(); };
  return th;
}

// A thin, empty stub cell for a collapsed game's row — matches the header's thin column and is
// itself clickable to restore, so the whole strip down the table brings the game back, not just
// the header at the top.
function thinCell(tag, n, cls) {
  const lbl = 'G' + n;
  const c = el(tag, (cls ? cls + ' ' : '') + 'gthin');
  c.title = `Bring ${lbl} back`;
  c.onclick = () => { hset('game').delete(lbl); repaint(); };
  return c;
}

function sum(acc, st, cols) {
  acc = acc || Object.fromEntries(cols.map(c => [c[0], 0]));
  cols.forEach(([k]) => acc[k] += (+st[k] || 0));
  return acc;
}

function buildTable(kind, cols, s, players, teamsMeta, slots = [0, 1]) {
  const table = el('table', 'players');  // .players = rows are people, so the Find box filters them
  table.dataset.tbl = kind;
  const rates = (kind === 'bat'
    ? [['GIDP', r => r.groundIntoDoublePlay || 0], ['AVG', avg], ['OBP', obpStr], ['SLG', slgStr], ['OPS', opsStr]]
    : [['ERA', era]]).filter(([lbl]) => !hset(kind).has(lbl));
  const sumCols = kind === 'bat' ? BAT_SUM : PIT_SUM;
  const statKey = kind === 'bat' ? 'batting' : 'pitching';
  const thead = el('thead');
  const r1 = el('tr'), r2 = el('tr');
  const nameTh = el('th', 'name', kind === 'bat' ? 'Player' : 'Pitcher');
  nameTh.rowSpan = 2; r1.appendChild(nameTh);

  if (cols.length) s.games.forEach((g, i) => {
    const n = gPos(s, i) + 1;
    const th = gameHead(g, n, 'gstart' + gTint(i), cols.length);
    r1.appendChild(th);
    if (hset('game').has('G' + n)) { r2.appendChild(thinCell('th', n, 'gstart')); return; }
    // the stat-label row stays white with red type; only the game's group header carries the tint
    cols.forEach(([, lbl], ci) => {
      const c = withStat(el('th', ci === 0 ? 'gstart' : '', lbl), lbl);
      c.dataset.gi = gPos(s, i);   // so clicking it sorts by that game, not the series
      r2.appendChild(c);
    });
  });

  const tt = el('th', 'tot tothead gstart'); tt.colSpan = cols.length + rates.length;
  tt.appendChild(el('div', 'glabel', 'SERIES TOTAL'));
  tt.appendChild(el('div', null, `${s.gtotal || s.games.length} G`));
  r1.appendChild(tt);
  cols.forEach(([, lbl], ci) => r2.appendChild(withStat(el('th', 'tot' + (ci === 0 ? ' gstart' : ''), lbl), lbl)));
  rates.forEach(([lbl]) => r2.appendChild(withStat(el('th', 'tot' + (lbl === 'OPS' ? ' ops-strong' : ['AVG','OBP','SLG'].includes(lbl) ? ' rate-dim' : ''), lbl), lbl)));
  thead.append(r1, r2); table.appendChild(thead);

  // one bold summary line over any set of players: per-game sums, series sums, then the rates
  const totalRow = (label, group, cls) => {
    const tr = el('tr', 'sum' + (cls ? ' ' + cls : ''));
    tr.appendChild(el('td', 'name', label));
    if (cols.length) s.games.forEach((g, i) => {
      const gi = gPos(s, i), n = gi + 1;
      if (hset('game').has('G' + n)) { tr.appendChild(thinCell('td', n, 'num gstart')); return; }
      const t = group.reduce((a, r) => {
        const st = r.g[gi] && r.g[gi][statKey];
        return filled(st) ? sum(a, st, sumCols) : a;
      }, null);
      cols.forEach(([k, lbl], ci) =>
        tr.appendChild(withStat(el('td', 'num' + (ci === 0 ? ' gstart' : ''), t ? cell(k, t) : '–'), lbl)));
    });
    const tot = group.reduce((a, r) => sum(a, r[kind], sumCols), null);
    cols.forEach(([k, lbl], ci) =>
      tr.appendChild(withStat(el('td', 'num tot' + (ci === 0 ? ' gstart' : ''), cell(k, tot)), lbl)));
    rates.forEach(([lbl, fn]) => tr.appendChild(withStat(el('td', 'num tot' + (lbl === 'OPS' ? ' ops-strong' : ['AVG','OBP','SLG'].includes(lbl) ? ' rate-dim' : ''), fn(tot)), lbl)));
    return tr;
  };

  // clicking a stat header sorts the players by it, inside each team block
  const act = sortActive(kind);
  const statVal = r => {
    const c = cols.find(([, l]) => l === act.stat);
    if (act.gi === null) {
      const rate = rates.find(([l]) => l === act.stat);
      if (rate) return sortNum(rate[1](r[kind]));
      return c ? +r[kind][c[0]] || 0 : null;
    }
    const st = r.g[act.gi] && r.g[act.gi][statKey];
    return filled(st) && c ? +st[c[0]] || 0 : null;   // no appearance in that game
  };

  const tbody = el('tbody');
  slots.forEach(ti => {
    const sd = SD[ti];
    const rows = [...players[sd].values()].filter(r => r[kind]);
    // default order: hitters in the latest game's batting order (then earlier games' extras),
    // pitchers in the order they first appeared
    rows.sort(act ? (a, b) => sortCmp(act.dir, statVal)(a, b) || a.name.localeCompare(b.name)
                  : kind === 'bat' ? (a,b) => b.ord.gi - a.ord.gi || a.ord.slot - b.ord.slot ||
                                              a.name.localeCompare(b.name)
                                   : (a,b) => a.pIdx - b.pIdx);
    const trT = el('tr', 'team');
    const tdT = el('td', 'name', teamsMeta[ti].name);
    tdT.colSpan = 1; trT.appendChild(tdT);
    const fill = el('td');
    fill.colSpan = s.games.reduce((n, g, i) => n + (hset('game').has('G' + (gPos(s, i) + 1)) ? 1 : cols.length), 0)
      + cols.length + rates.length;
    trT.appendChild(fill); tbody.appendChild(trT);

    // pitchers split into starters and relievers, each with its own subtotal
    const groups = kind === 'pit'
      ? [['STARTERS', rows.filter(r => r.gs)], ['RELIEVERS', rows.filter(r => !r.gs)]]
      : [[null, rows]];

    groups.forEach(([label, group]) => {
      group.forEach(r => {
        const tr = el('tr');
        tr.dataset.pid = r.id;
        const td = el('td', 'name');
        td.appendChild(document.createTextNode(r.name + ' ')); // real space so CSV export doesn't run name into pos
        td.appendChild(el('span', 'pos', r.pos));
        tr.appendChild(td);
        if (cols.length) s.games.forEach((g, i) => {
          const gi = gPos(s, i), n = gi + 1;
          if (hset('game').has('G' + n)) { tr.appendChild(thinCell('td', n, 'num gstart' + gTint(i))); return; }
          const st = r.g[gi] && r.g[gi][statKey];
          const has = filled(st);
          cols.forEach(([k, lbl], ci) => {
            const v = has ? cell(k, st) : '–';
            const c = el('td', 'num' + (ci === 0 ? ' gstart' : '') + gTint(i) + (has && +st[k] === 0 ? ' z' : ''), v);
            tr.appendChild(withStat(c, lbl));
          });
        });
        cols.forEach(([k, lbl], ci) => tr.appendChild(withStat(el('td', 'num tot' + (ci === 0 ? ' gstart' : ''), cell(k, r[kind])), lbl)));
        rates.forEach(([lbl, fn]) => tr.appendChild(withStat(el('td', 'num tot' + (lbl === 'OPS' ? ' ops-strong' : ['AVG','OBP','SLG'].includes(lbl) ? ' rate-dim' : ''), fn(r[kind])), lbl)));
        tbody.appendChild(tr);
      });
      if (label && group.length) tbody.appendChild(totalRow(label, group, 'subsum'));
    });

    if (rows.length) tbody.appendChild(totalRow('TEAM TOTAL', rows));
  });
  table.appendChild(tbody);
  return table;
}

const cell = (k, st) => k === 'outs' ? ip(+st.outs || 0) : String(+st[k] || 0);
// stamp the stat name on a cell so clicking that column header can light up every copy of it
const withStat = (e, lbl) => { e.dataset.stat = lbl; return e; };

// ---- find + pin: filter player rows by name, click a row to keep it highlighted ----

function applyFilter() {
  // comma-separated: "rice, volpe, judge" keeps any row matching one of them
  const terms = $('find').value.toLowerCase().split(',').map(t => t.trim()).filter(Boolean);
  document.querySelectorAll('#out table.players tbody tr').forEach(tr => {
    if (tr.classList.contains('team') || tr.classList.contains('sum')) return;  // keep team headers + TEAM TOTAL
    const name = tr.cells[0].textContent.toLowerCase();
    tr.hidden = !!terms.length && !terms.some(t => name.includes(t));
  });
}
$('find').oninput = applyFilter;

$('out').onclick = e => {
  // a stat column header: light that stat up for everyone, in every game group and the total
  // a stat column header: sort by it and light it up. Click again for least-first, a third time to reset.
  const th = e.target.closest('thead th[data-stat]');
  if (th) {
    const tbl = th.closest('table').dataset.tbl;
    const gi = th.dataset.gi === undefined ? null : +th.dataset.gi;
    const same = sortBy && sortBy.tbl === tbl && sortBy.stat === th.dataset.stat && sortBy.gi === gi;
    sortBy = same ? (sortBy.dir === -1 ? { ...sortBy, dir: 1 } : null)
                  : { tbl, stat: th.dataset.stat, gi, dir: -1 };
    repaint();
    return;
  }
  const tr = e.target.closest('tbody tr');
  if (!tr || tr.classList.contains('team')) return;
  const table = tr.closest('table');
  if (table.classList.contains('players')) {
    if (e.target.closest('td.name') && tr.dataset.pid) { openPlayerModal(tr.dataset.pid); return; }
    if (tr.classList.contains('sum') || tr.classList.contains('subsum')) return;  // summary rows aren't a player
    tr.classList.toggle('pick'); return;
  }
  // team tables: rows ARE stats, so pin that stat line for both teams at once
  const label = tr.cells[0].textContent, on = !tr.classList.contains('pick');
  [...table.tBodies[0].rows].forEach(r =>
    r.classList.contains('team') || r.cells[0].textContent !== label || r.classList.toggle('pick', on));
};
$('modalClose').onclick = closeModal;
$('modalDownload').onclick = downloadGraphic;
$('modalBackdrop').onclick = e => { if (e.target.id === 'modalBackdrop') closeModal(); };
document.onkeydown = e => {
  if (e.key !== 'Escape') return;
  if (!$('modalBackdrop').hidden) { closeModal(); return; }
  document.querySelectorAll('tr.pick').forEach(tr => tr.classList.remove('pick'));
  if (sortBy) { sortBy = null; repaint(); }
};

// ---- live refresh: repoll only while a game in the selected series is actually in progress ----

const LIVE_REFRESH = true;   // in-progress games repoll on their own
const LIVE_MS = 45000;
let liveTimer = null;

function armLive(sel) {
  clearTimeout(liveTimer); liveTimer = null;
  if (!LIVE_REFRESH || !sel || !(sel.played || []).some(g => g.status.codedGameState === 'I')) return;
  liveTimer = setTimeout(() => guard(tickLive)(), LIVE_MS);
}

async function tickLive() {
  const sel = series[+$('series').value];
  if (!sel || !(sel.played || []).some(g => g.status.codedGameState === 'I')) return;
  if (document.hidden && !onAirPid) return armLive(sel);  // a background tab with nothing on-air doesn't need fresh numbers

  // refresh scores/status for this series' date range, patching the game objects in place
  const a = sel.games[0].officialDate, b = sel.games[sel.games.length-1].officialDate;
  const d = await j(`${API}/schedule?sportId=1&teamId=${teamId()}&startDate=${a}&endDate=${b}&hydrate=probablePitcher`);
  const fresh = new Map(d.dates.flatMap(x => x.games).map(g => [g.gamePk, g]));
  sel.games.forEach(g => {
    const f = fresh.get(g.gamePk);
    if (f) { g.status = f.status; g.teams = f.teams; }
  });
  sel.played = sel.games.filter(g => 'FOI'.includes(g.status.codedGameState));  // a game may have just started

  // keep what the user was looking at: pinned rows and scroll position (sort/hide state is already kept)
  const keep = {
    y: window.scrollY,
    rows: [...document.querySelectorAll('tr.pick')].map(tr => tr.cells[0].textContent),
  };
  await render();
  document.querySelectorAll('#out tbody tr').forEach(tr => {
    if (keep.rows.includes(tr.cells[0].textContent)) tr.classList.add('pick');
  });
  window.scrollTo(0, keep.y);

  if (onAirPid) {
    const row = currentIndex.get(String(onAirPid));
    const data = row && (onAirSplit === 'series' ? seriesGraphicData(row) : await seasonGraphicData(row, onAirPid, onAirSplit));
    if (row && data) pushOnAir(onAirPid, row, data, onAirSplit);
  }
}

const guard = fn => (...a) => fn(...a).catch(e => say(e.message, true));
$('season').onchange = guard(loadSeries);
$('series').onchange = guard(render);
$('openDisplay').onclick = () => {
  const url = new URL(location.href); url.searchParams.set('display', '1');
  window.open(url.href, '_blank');
};
$('onairClear').onclick = clearOnAir;

const yr = new Date().getFullYear();
if (isDisplayMode) {
  initDisplay();
} else {
  $('season').innerHTML = Array.from({length: yr - 2013}, (_, i) => yr - i).map(y => `<option>${y}</option>`).join('');
  guard(loadSeries)();  // land on the most recent series of the current season
}
</script>
